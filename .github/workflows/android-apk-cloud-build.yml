name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          sdkmanager --list_installed \
            | grep -E \
              'platform-tools|platforms;android-35|build-tools;35.0.0' \
            || true

      - name: Find TaskMaster Android project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
              -name 'TaskMasterProMax_Android_*.zip' \
              -printf '%f\n' \
              | sort -V
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No TaskMasterProMax_Android_*.zip found in repository root."
            echo
            echo "Repository root files:"
            find . -maxdepth 1 -type f \
              -printf '%f\n' \
              | sort
            exit 1
          fi

          ZIP_NAME="${ZIPS[${#ZIPS[@]}-1]}"

          echo "Using Android project ZIP:"
          echo "$ZIP_NAME"

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

          echo
          echo "ZIP SHA-256:"
          sha256sum "$ZIP_NAME"

      - name: Verify and extract Android project
        shell: bash
        env:
          ZIP_NAME: ${{ steps.find_zip.outputs.zip_name }}
        run: |
          set -euo pipefail

          test -f "$ZIP_NAME"

          unzip -t "$ZIP_NAME" >/dev/null

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_NAME" -d extracted

          if [ -f extracted/project/settings.gradle ]; then
            PROJECT_DIR="extracted/project"
          elif [ -f extracted/settings.gradle ]; then
            PROJECT_DIR="extracted"
          else
            echo "ERROR: Android Gradle project not found after extraction."
            echo
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f \
              | sort \
              | head -300
            exit 1
          fi

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify project structure and release identity
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/taskmaster/promax/MainActivity.java
          test -f app/src/main/java/com/taskmaster/promax/TaskDao.java
          test -f app/src/main/java/com/taskmaster/promax/ReminderDatabase.java
          test -f app/src/main/java/com/taskmaster/promax/ReminderReceiver.java
          test -f app/src/main/java/com/taskmaster/promax/BootReceiver.java
          test -f app/src/main/java/com/taskmaster/promax/ReminderRescheduler.java

          grep -q 'versionCode 22' app/build.gradle
          grep -q 'versionName "1.1.1"' app/build.gradle

          grep -q \
            'sourceCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          grep -q \
            'targetCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          echo "Project structure: PASS"
          echo "Release version: 1.1.1 / 22"
          echo "Java 17 configuration: PASS"

      - name: Verify notification and reminder architecture
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/taskmaster/promax/MainActivity.java"
          MANIFEST="app/src/main/AndroidManifest.xml"
          HTML="app/src/main/assets/index.html"

          test -f \
            app/src/main/java/com/taskmaster/promax/ReminderReceiver.java

          test -f \
            app/src/main/java/com/taskmaster/promax/BootReceiver.java

          test -f \
            app/src/main/java/com/taskmaster/promax/ReminderRescheduler.java

          test -f \
            app/src/main/java/com/taskmaster/promax/ReminderDatabase.java

          grep -q 'ReminderDatabase' "$MAIN"

          grep -q 'saveTask' "$MAIN"
          grep -q 'completeTask' "$MAIN"
          grep -q 'rescheduleTask' "$MAIN"
          grep -q 'deleteTaskNative' "$MAIN"

          grep -q 'saveRecurringTask' "$MAIN"
          grep -q 'setRecurringEnabled' "$MAIN"
          grep -q 'deleteRecurringTask' "$MAIN"

          grep -q 'scheduleReminder' "$MAIN"
          grep -q 'cancelReminder' "$MAIN"

          grep -q 'openTaskFromReminder' "$MAIN"
          grep -q 'openTaskFromReminder' "$HTML"

          grep -q 'POST_NOTIFICATIONS' "$MANIFEST"
          grep -q 'SCHEDULE_EXACT_ALARM' "$MANIFEST"
          grep -q 'RECEIVE_BOOT_COMPLETED' "$MANIFEST"
          grep -q 'BOOT_COMPLETED' "$MANIFEST"

          echo "Notification and reminder architecture: PASS"

      - name: Run preflight checks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 tools/preflight.py

      - name: Run final build gate
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 tools/final_build_gate.py

      - name: Run final release audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 tools/final_release_audit.py

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            tasks --all

      - name: Compile Debug Java
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "================================================"
          echo " TaskMaster Pro Max APK Build"
          echo " Version      : 1.1.1"
          echo " Version Code : 22"
          echo "================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Verify APK output
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: app-debug.apk was not created."
            echo
            echo "Available build files:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              | sort \
              || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Verify APK signature
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK signature: PASS"
          echo "APK ZIP integrity: PASS"

      - name: Upload Gradle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TaskMasterProMax-build-diagnostics
          if-no-files-found: ignore
          path: |
            gradle-build.log
            extracted/project/app/build/reports/**
            extracted/project/app/build/outputs/logs/**
            extracted/app/build/reports/**
            extracted/app/build/outputs/logs/**

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            release/TaskMasterProMax-v1.1.1-debug.apk

          sha256sum \
            release/TaskMasterProMax-v1.1.1-debug.apk \
            | tee release/SHA256SUM.txt

          echo
          echo "Release files:"
          ls -lh release/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error
          path: |
            release/TaskMasterProMax-v1.1.1-debug.apk
            release/SHA256SUM.txt

      - name: Final success
        if: success()
        run: |
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo "================================================"
