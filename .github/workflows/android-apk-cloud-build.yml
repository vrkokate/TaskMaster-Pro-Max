name: TaskMaster Pro Max - Cloud APK Build

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Extract TaskMaster Pro Max project
        run: |
          unzip -q TaskMasterProMax_Android_v22_Cloud_APK_Build.zip
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Run preflight
        working-directory: project
        run: python3 tools/preflight.py

      - name: Run final build gate
        working-directory: project
        run: python3 tools/final_build_gate.py

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: project
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        working-directory: project
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
          TaskMasterProMax-v1.1.1-debug.apk
          sha256sum TaskMasterProMax-v1.1.1-debug.apk \
          > TaskMasterProMax-v1.1.1-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskMaster-Pro-Max-APK
          path: |
            project/TaskMasterProMax-v1.1.1-debug.apk
            project/TaskMasterProMax-v1.1.1-debug.apk.sha256
