      - name: Build installable Debug APK
        working-directory: extracted/project
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "TASKMASTER PRO MAX - APK BUILD"
          echo "=========================================="

          echo ""
          echo "Running Gradle assembleDebug..."
          echo ""

          gradle --no-daemon \
            --stacktrace \
            --console=plain \
            :app:assembleDebug \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "GRADLE EXIT CODE: $BUILD_STATUS"
          echo "=========================================="

          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo ""
            echo "APK BUILD COMMAND: SUCCESS"
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "APK BUILD FAILED"
          echo "=========================================="

          echo ""
          echo "========== GRADLE ERROR SUMMARY =========="
          echo ""

          grep -n -A 12 -B 5 \
            "What went wrong" \
            build.log || true

          echo ""
          echo "========== EXECUTION FAILED =========="
          echo ""

          grep -n -A 15 -B 5 \
            "Execution failed" \
            build.log || true

          echo ""
          echo "========== COMPILATION ERRORS =========="
          echo ""

          grep -n -E \
            "error:|ERROR:|cannot find symbol|does not exist|Could not resolve|Duplicate class|Manifest merger failed|resource .* not found|uses-sdk|failed" \
            build.log \
            | tail -150 || true

          echo ""
          echo "========== LAST 200 LINES =========="
          echo ""

          tail -200 build.log

          echo ""
          echo "=========================================="
          echo "END OF BUILD DIAGNOSTICS"
          echo "=========================================="

          exit "$BUILD_STATUS"
