name: TaskMaster Pro Max - Cloud APK Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate TaskMaster project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="TaskMasterProMax_Android_v22_FINAL_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found project ZIP:"
          ls -lh "$ZIP_FILE"

      - name: Extract TaskMaster Pro Max project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "TaskMasterProMax_Android_v22_FINAL_FIXED.zip" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted/project"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f -name "build.gradle" -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found:"
          ls -la "$PROJECT_DIR"

      - name: Verify release version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking TaskMaster Pro Max release version..."

          grep -n "versionCode" app/build.gradle
          grep -n "versionName" app/build.gradle

          grep -q 'versionCode 22' app/build.gradle
          grep -q 'versionName "1.1.1"' app/build.gradle

          echo "PASS - versionCode 22"
          echo "PASS - versionName 1.1.1"

      - name: Run preflight
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/preflight.py

      - name: Run final build gate
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/final_build_gate.py

      - name: Run final release audit
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/final_release_audit.py

      - name: Build installable debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Copy APK
        shell: bash
        run: |
          set -e

          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "TaskMasterProMax-v1.1.1-debug.apk"

          ls -lh "TaskMasterProMax-v1.1.1-debug.apk"

      - name: Generate SHA-256
        shell: bash
        run: |
          set -e

          sha256sum "TaskMasterProMax-v1.1.1-debug.apk" \
            | tee "TaskMasterProMax-v1.1.1-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error
          path: |
            TaskMasterProMax-v1.1.1-debug.apk
            TaskMasterProMax-v1.1.1-debug.apk.sha256

      - name: Build completed
        shell: bash
        run: |
          echo "=========================================="
          echo "TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "Version: 1.1.1"
          echo "Version Code: 22"
          echo "APK: TaskMasterProMax-v1.1.1-debug.apk"
          echo "=========================================="
