name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK 35
      # ============================================================

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. SETUP GRADLE 8.7
      # ============================================================

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'


      # ============================================================
      # 6. VERIFY JAVA / GRADLE
      # ============================================================

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version


      # ============================================================
      # 7. FIND ANDROID PROJECT ZIP
      #
      # IMPORTANT:
      # Do NOT require a specific V22/V23/V24 filename.
      # The newest matching ZIP in repository will be selected.
      # ============================================================

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for TaskMaster Android project ZIP..."

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
              -name 'TaskMasterProMax_Android_*.zip' \
              -printf '%f\n' \
              | sort -V
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo
            echo "ERROR: No TaskMaster Android project ZIP found."
            echo
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          ZIP_NAME="${ZIPS[${#ZIPS[@]}-1]}"

          echo "ZIP files found:"
          printf '%s\n' "${ZIPS[@]}"

          echo
          echo "Selected project:"
          echo "$ZIP_NAME"

          echo "PROJECT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"


      # ============================================================
      # 8. VERIFY ZIP
      # ============================================================

      - name: Verify selected ZIP
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ZIP"

          echo "Selected ZIP:"
          ls -lh "$PROJECT_ZIP"

          echo
          echo "SHA-256:"
          sha256sum "$PROJECT_ZIP"

          echo
          echo "ZIP integrity test:"

          unzip -t "$PROJECT_ZIP" >/dev/null

          echo "ZIP integrity: PASS"


      # ============================================================
      # 9. EXTRACT PROJECT
      # ============================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "Extracted top-level structure:"
          find extracted -maxdepth 2 -type f | sort | head -100


      # ============================================================
      # 10. DETERMINE PROJECT DIRECTORY
      #
      # Supports:
      # extracted/project/
      # OR
      # extracted/
      # ============================================================

      - name: Determine project directory
        shell: bash
        run: |
          set -e

          if [ -f "extracted/project/settings.gradle" ] \
             && [ -f "extracted/project/app/build.gradle" ]; then

            PROJECT_DIR="extracted/project"

          elif [ -f "extracted/settings.gradle" ] \
               && [ -f "extracted/app/build.gradle" ]; then

            PROJECT_DIR="extracted"

          else
            echo "ERROR: Android Gradle project could not be located."

            echo
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | sort

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Android project directory:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 11. NORMALIZE PROJECT FOR FINAL RELEASE 1.1.1 / 22
      #
      # This removes old CI/version mismatches from older ZIPs.
      # ============================================================

      - name: Normalize project CI configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")

          # --------------------------------------------------------
          # 1. app/build.gradle
          # --------------------------------------------------------

          gradle = Path("app/build.gradle")

          text = gradle.read_text(encoding="utf-8")

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 22',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.1.1"',
              text,
              count=1
          )

          if "sourceCompatibility JavaVersion.VERSION_17" not in text:
              marker = "    buildTypes {"

              java_block = """    // CI Java 17 compatibility
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

          """

              if marker in text:
                  text = text.replace(marker, java_block + marker, 1)
              else:
                  raise SystemExit(
                      "ERROR: buildTypes marker not found in app/build.gradle"
                  )

          gradle.write_text(text, encoding="utf-8")


          # --------------------------------------------------------
          # 2. gradle.properties
          # --------------------------------------------------------

          props = Path("gradle.properties")

          existing = props.read_text(encoding="utf-8") \
              if props.exists() else ""

          required = [
              "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8",
              "org.gradle.daemon=false",
              "org.gradle.parallel=false",
              "android.useAndroidX=true",
              "android.enableJetifier=false",
              "android.nonTransitiveRClass=false",
          ]

          lines = existing.splitlines()

          for item in required:
              key = item.split("=", 1)[0]

              if not any(
                  line.startswith(key + "=")
                  for line in lines
              ):
                  lines.append(item)

          props.write_text(
              "\n".join(lines).rstrip() + "\n",
              encoding="utf-8"
          )


          # --------------------------------------------------------
          # 3. preflight.py
          # --------------------------------------------------------

          p = Path("tools/preflight.py")

          if p.exists():
              s = p.read_text(encoding="utf-8")

              s = s.replace(
                  "ok('Release version 1.0.3/14', 'versionCode 14' in gradle and 'versionName \"1.0.3\"' in gradle)",
                  "ok('Release version 1.1.1/22', 'versionCode 22' in gradle and 'versionName \"1.1.1\"' in gradle)"
              )

              p.write_text(s, encoding="utf-8")


          # --------------------------------------------------------
          # 4. qa_check.py
          # --------------------------------------------------------

          p = Path("qa_check.py")

          if p.exists():
              s = p.read_text(encoding="utf-8")

              s = s.replace(
                  "versionCode 20",
                  "versionCode 22"
              )

              s = s.replace(
                  'versionName "1.0.9"',
                  'versionName "1.1.1"'
              )

              s = s.replace(
                  "TaskMaster Pro Max v1.0.9 (20)",
                  "TaskMaster Pro Max v1.1.1 (22)"
              )

              p.write_text(s, encoding="utf-8")


          # --------------------------------------------------------
          # 5. release_audit.py
          # --------------------------------------------------------

          p = Path("tools/release_audit.py")

          if p.exists():
              s = p.read_text(encoding="utf-8")

              s = s.replace(
                  "ok('Version 1.0.4 / code 15', 'versionCode 16' in text and 'versionName \"1.0.5\"' in text)",
                  "ok('Version 1.1.1 / code 22', 'versionCode 22' in text and 'versionName \"1.1.1\"' in text)"
              )

              p.write_text(s, encoding="utf-8")


          # --------------------------------------------------------
          # 6. release_manifest.py
          # --------------------------------------------------------

          p = Path("tools/release_manifest.py")

          if p.exists():
              s = p.read_text(encoding="utf-8")

              s = re.sub(
                  r"'version':\s*'[^']+'",
                  "'version':'1.1.1'",
                  s
              )

              s = re.sub(
                  r"'versionCode':\s*\d+",
                  "'versionCode':22",
                  s
              )

              p.write_text(s, encoding="utf-8")


          print("PROJECT NORMALIZATION: PASS")
          PY


      # ============================================================
      # 12. VERIFY FINAL CONFIGURATION
      # ============================================================

      - name: Verify final project configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking version..."

          grep -q 'versionCode 22' app/build.gradle
          grep -q 'versionName "1.1.1"' app/build.gradle

          echo "Checking compileSdk..."

          grep -q 'compileSdk 35' app/build.gradle

          echo "Checking targetSdk..."

          grep -q 'targetSdk 35' app/build.gradle

          echo "Checking Java 17..."

          grep -q 'sourceCompatibility JavaVersion.VERSION_17' app/build.gradle
          grep -q 'targetCompatibility JavaVersion.VERSION_17' app/build.gradle

          echo "Checking Gradle properties..."

          test -s gradle.properties

          echo
          echo "FINAL PROJECT CONFIGURATION: PASS"


      # ============================================================
      # 13. PREFLIGHT
      # ============================================================

      - name: Run preflight checks
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/preflight.py


      # ============================================================
      # 14. FINAL BUILD GATE
      # ============================================================

      - name: Run final build gate
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/final_build_gate.py


      # ============================================================
      # 15. FINAL RELEASE AUDIT
      # ============================================================

      - name: Run final release audit
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/final_release_audit.py


      # ============================================================
      # 16. VERIFY GRADLE PROJECT
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            tasks --all


      # ============================================================
      # 17. BUILD DEBUG APK
      # ============================================================

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo
          echo "=============================================="
          echo " TASKMASTER PRO MAX APK BUILD"
          echo " Version      : 1.1.1"
          echo " Version Code : 22"
          echo "=============================================="
          echo

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

          echo
          echo "APK BUILD COMMAND COMPLETED"


      # ============================================================
      # 18. VERIFY APK
      # ============================================================

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: app-debug.apk was not created."

            echo
            echo "Available APK files:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo
          echo "APK CREATED SUCCESSFULLY:"
          ls -lh "$APK"


      # ============================================================
      # 19. PREPARE RELEASE ARTIFACT
      # ============================================================

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "release/TaskMasterProMax-v1.1.1-debug.apk"

          sha256sum \
            "release/TaskMasterProMax-v1.1.1-debug.apk" \
            | tee "release/SHA256SUM.txt"

          echo
          echo "Release artifact:"
          ls -lh release/


      # ============================================================
      # 20. UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TaskMasterProMax-v1.1.1-APK
          path: |
            release/TaskMasterProMax-v1.1.1-debug.apk
            release/SHA256SUM.txt
          if-no-files-found: error


      # ============================================================
      # 21. FINAL SUCCESS
      # ============================================================

      - name: Final build success
        shell: bash
        run: |
          echo
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo
          echo "Download the APK from GitHub Actions Artifacts."
          echo
