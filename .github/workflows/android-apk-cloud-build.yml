name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e
          java -version
          gradle --version

      - name: Find TaskMaster Android project ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
              -name 'TaskMasterProMax_Android_*.zip' \
              -printf '%f\n' | sort -V
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No TaskMasterProMax Android project ZIP found."
            ls -lah
            exit 1
          fi

          ZIP_NAME="${ZIPS[${#ZIPS[@]}-1]}"
          echo "PROJECT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"

          echo "Selected:"
          echo "$ZIP_NAME"

      - name: Verify project ZIP
        shell: bash
        run: |
          set -e
          test -f "$PROJECT_ZIP"
          unzip -t "$PROJECT_ZIP" >/dev/null
          sha256sum "$PROJECT_ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

      - name: Determine Android project directory
        shell: bash
        run: |
          set -e

          if [ -f "extracted/project/settings.gradle" ] \
             && [ -f "extracted/project/app/build.gradle" ]; then
            PROJECT_DIR="extracted/project"
          elif [ -f "extracted/settings.gradle" ] \
             && [ -f "extracted/app/build.gradle" ]; then
            PROJECT_DIR="extracted"
          else
            echo "ERROR: Android Gradle project not found."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Normalize Gradle and Room configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 23',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.1.2"',
              s,
              count=1
          )

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              marker = "    buildTypes {"

              block = """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

          """

              if marker not in s:
                  raise SystemExit(
                      "ERROR: Cannot add Java 17 compileOptions."
                  )

              s = s.replace(marker, block + marker, 1)

          p.write_text(s, encoding="utf-8")

          p = Path("gradle.properties")

          existing = p.read_text(encoding="utf-8") \
              if p.exists() else ""

          lines = existing.splitlines()

          required = {
              "org.gradle.jvmargs":
                  "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8",
              "org.gradle.daemon":
                  "org.gradle.daemon=false",
              "org.gradle.parallel":
                  "org.gradle.parallel=false",
              "android.useAndroidX":
                  "android.useAndroidX=true",
              "android.enableJetifier":
                  "android.enableJetifier=false",
              "android.nonTransitiveRClass":
                  "android.nonTransitiveRClass=false",
          }

          for key, value in required.items():
              lines = [
                  line for line in lines
                  if not line.startswith(key + "=")
              ]
              lines.append(value)

          p.write_text(
              "\n".join(lines).rstrip() + "\n",
              encoding="utf-8"
          )

          entity_dir = Path(
              "app/src/main/java/com/taskmaster/promax"
          )

          fixes = {
              "TaskEntity.java": "id",
              "ReminderEntity.java": "taskId",
              "RecurringTaskEntity.java": "id",
          }

          for filename, field in fixes.items():

              p = entity_dir / filename

              if not p.exists():
                  raise SystemExit(
                      f"ERROR: Missing entity {filename}"
                  )

              s = p.read_text(encoding="utf-8")

              if "import androidx.annotation.NonNull;" not in s:
                  s = s.replace(
                      "package com.taskmaster.promax;\n\n",
                      "package com.taskmaster.promax;\n\n"
                      "import androidx.annotation.NonNull;\n",
                      1
                  )

              s = s.replace(
                  f"@PrimaryKey public String {field};",
                  f"@PrimaryKey @NonNull public String {field};"
              )

              if (
                  f"@PrimaryKey @NonNull public String {field};"
                  not in s
              ):
                  raise SystemExit(
                      f"ERROR: Room primary key repair failed: {filename}"
                  )

              p.write_text(s, encoding="utf-8")

          p = entity_dir / "TaskDao.java"

          if p.exists():
              s = p.read_text(encoding="utf-8")

              s = re.sub(
                  r'(@Query\("SELECT COUNT\(\*\) FROM tasks '
                  r'WHERE status!=\'COMPLETED\' AND dueAt < :now"\)'
                  r'\s*)'
                  r'int\s+countOverdue\s*\(\s*\)\s*;',
                  r'\1int countOverdue(long now);',
                  s,
                  count=1
              )

              p.write_text(s, encoding="utf-8")

          print("Gradle configuration: PASS")
          print("Room configuration: PASS")
          PY

      - name: Add Android notification infrastructure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          SRC="app/src/main/java/com/taskmaster/promax"

          mkdir -p "$SRC"

          cat > "$SRC/TaskReminderReceiver.java" <<'EOF'
          package com.taskmaster.promax;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;

          public class TaskReminderReceiver extends BroadcastReceiver {

              public static final String ACTION_TASK_REMINDER =
                      "com.taskmaster.promax.TASK_REMINDER";

              public static final String EXTRA_TASK_ID = "taskId";
              public static final String EXTRA_TITLE = "title";
              public static final String EXTRA_MESSAGE = "message";

              public static final String CHANNEL_ID =
                      "taskmaster_reminders";

              @Override
              public void onReceive(Context context, Intent intent) {

                  if (intent == null) {
                      return;
                  }

                  String action = intent.getAction();

                  if (!ACTION_TASK_REMINDER.equals(action)) {
                      return;
                  }

                  String taskId =
                          intent.getStringExtra(EXTRA_TASK_ID);

                  String title =
                          intent.getStringExtra(EXTRA_TITLE);

                  String message =
                          intent.getStringExtra(EXTRA_MESSAGE);

                  if (title == null || title.trim().isEmpty()) {
                      title = "TaskMaster Pro Max";
                  }

                  if (message == null || message.trim().isEmpty()) {
                      message = "Task reminder";
                  }

                  createNotificationChannel(context);

                  if (Build.VERSION.SDK_INT >= 33) {

                      if (
                          context.checkSelfPermission(
                              Manifest.permission.POST_NOTIFICATIONS
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          return;
                      }
                  }

                  Intent openIntent =
                          new Intent(context, MainActivity.class);

                  openIntent.setFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP
                  );

                  if (taskId != null) {
                      openIntent.putExtra(
                              "openTaskFromReminder",
                              taskId
                      );
                  }

                  int requestCode =
                          taskId == null
                                  ? 1000
                                  : Math.abs(taskId.hashCode());

                  PendingIntent pendingIntent =
                          PendingIntent.getActivity(
                                  context,
                                  requestCode,
                                  openIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT |
                                  PendingIntent.FLAG_IMMUTABLE
                          );

                  Uri sound =
                          RingtoneManager.getDefaultUri(
                                  RingtoneManager.TYPE_NOTIFICATION
                          );

                  NotificationCompat.Builder builder =
                          new NotificationCompat.Builder(
                                  context,
                                  CHANNEL_ID
                          )
                          .setSmallIcon(
                                  android.R.drawable.ic_dialog_info
                          )
                          .setContentTitle(title)
                          .setContentText(message)
                          .setStyle(
                                  new NotificationCompat.BigTextStyle()
                                          .bigText(message)
                          )
                          .setPriority(
                                  NotificationCompat.PRIORITY_HIGH
                          )
                          .setCategory(
                                  NotificationCompat.CATEGORY_REMINDER
                          )
                          .setAutoCancel(true)
                          .setSound(sound)
                          .setContentIntent(pendingIntent);

                  NotificationManagerCompat.from(context)
                          .notify(requestCode, builder.build());
              }

              public static void createNotificationChannel(
                      Context context
              ) {

                  if (Build.VERSION.SDK_INT < 26) {
                      return;
                  }

                  NotificationManager manager =
                          context.getSystemService(
                                  NotificationManager.class
                          );

                  if (manager == null) {
                      return;
                  }

                  Uri sound =
                          RingtoneManager.getDefaultUri(
                                  RingtoneManager.TYPE_NOTIFICATION
                          );

                  AudioAttributes attributes =
                          new AudioAttributes.Builder()
                                  .setUsage(
                                          AudioAttributes.USAGE_NOTIFICATION
                                  )
                                  .setContentType(
                                          AudioAttributes.CONTENT_TYPE_SONIFICATION
                                  )
                                  .build();

                  NotificationChannel channel =
                          new NotificationChannel(
                                  CHANNEL_ID,
                                  "Task Reminders",
                                  NotificationManager.IMPORTANCE_HIGH
                          );

                  channel.setDescription(
                          "TaskMaster Pro Max task reminders"
                  );

                  channel.enableVibration(true);

                  channel.setSound(
                          sound,
                          attributes
                  );

                  manager.createNotificationChannel(channel);
              }
          }
          EOF

          cat > "$SRC/TaskReminderBootReceiver.java" <<'EOF'
          package com.taskmaster.promax;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class TaskReminderBootReceiver
                  extends BroadcastReceiver {

              @Override
              public void onReceive(
                      Context context,
                      Intent intent
              ) {

                  if (intent == null) {
                      return;
                  }

                  String action = intent.getAction();

                  if (
                      Intent.ACTION_BOOT_COMPLETED.equals(action) ||
                      Intent.ACTION_MY_PACKAGE_REPLACED.equals(action)
                  ) {

                      TaskReminderScheduler
                              .restoreScheduledReminders(context);
                  }
              }
          }
          EOF

          cat > "$SRC/TaskReminderScheduler.java" <<'EOF'
          package com.taskmaster.promax;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public final class TaskReminderScheduler {

              private TaskReminderScheduler() {}

              private static final String PREFS =
                      "taskmaster_reminders";

              private static final String KEY_PREFIX =
                      "reminder_";

              public static void schedule(
                      Context context,
                      String taskId,
                      String title,
                      String message,
                      long triggerAtMillis
              ) {

                  if (
                      taskId == null ||
                      taskId.trim().isEmpty()
                  ) {
                      return;
                  }

                  if (triggerAtMillis <= 0) {
                      return;
                  }

                  Context app =
                          context.getApplicationContext();

                  TaskReminderReceiver
                          .createNotificationChannel(app);

                  Intent intent =
                          new Intent(
                                  app,
                                  TaskReminderReceiver.class
                          );

                  intent.setAction(
                          TaskReminderReceiver.ACTION_TASK_REMINDER
                  );

                  intent.putExtra(
                          TaskReminderReceiver.EXTRA_TASK_ID,
                          taskId
                  );

                  intent.putExtra(
                          TaskReminderReceiver.EXTRA_TITLE,
                          title
                  );

                  intent.putExtra(
                          TaskReminderReceiver.EXTRA_MESSAGE,
                          message
                  );

                  int requestCode =
                          Math.abs(taskId.hashCode());

                  PendingIntent pendingIntent =
                          PendingIntent.getBroadcast(
                                  app,
                                  requestCode,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT |
                                  PendingIntent.FLAG_IMMUTABLE
                          );

                  AlarmManager alarmManager =
                          (AlarmManager) app.getSystemService(
                                  Context.ALARM_SERVICE
                          );

                  if (alarmManager == null) {
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= 23) {

                      alarmManager.setExactAndAllowWhileIdle(
                              AlarmManager.RTC_WAKEUP,
                              triggerAtMillis,
                              pendingIntent
                      );

                  } else {

                      alarmManager.setExact(
                              AlarmManager.RTC_WAKEUP,
                              triggerAtMillis,
                              pendingIntent
                      );
                  }

                  app.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                  )
                  .edit()
                  .putString(
                          KEY_PREFIX + taskId,
                          taskId
                  )
                  .apply();
              }

              public static void cancel(
                      Context context,
                      String taskId
              ) {

                  if (
                      taskId == null ||
                      taskId.trim().isEmpty()
                  ) {
                      return;
                  }

                  Context app =
                          context.getApplicationContext();

                  Intent intent =
                          new Intent(
                                  app,
                                  TaskReminderReceiver.class
                          );

                  intent.setAction(
                          TaskReminderReceiver.ACTION_TASK_REMINDER
                  );

                  PendingIntent pendingIntent =
                          PendingIntent.getBroadcast(
                                  app,
                                  Math.abs(taskId.hashCode()),
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT |
                                  PendingIntent.FLAG_IMMUTABLE
                          );

                  AlarmManager alarmManager =
                          (AlarmManager) app.getSystemService(
                                  Context.ALARM_SERVICE
                          );

                  if (alarmManager != null) {
                      alarmManager.cancel(pendingIntent);
                  }

                  pendingIntent.cancel();

                  app.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                  )
                  .edit()
                  .remove(KEY_PREFIX + taskId)
                  .apply();
              }

              public static void restoreScheduledReminders(
                      Context context
              ) {

                  /*
                   * The receiver is intentionally safe on boot.
                   *
                   * Existing task records remain owned by the
                   * application's existing Room database.
                   *
                   * The native scheduler is available for the
                   * existing MainActivity bridge to reschedule
                   * each active reminder.
                   */
                  TaskReminderReceiver
                          .createNotificationChannel(context);
              }
          }
          EOF

          echo "Notification infrastructure added."

      - name: Update Android manifest for notifications
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found."
              )

          s = p.read_text(encoding="utf-8")

          permissions = """
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          """

          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = s.replace(
                  "<manifest ",
                  "<manifest ",
                  1
              )

              pos = s.find(">")

              if pos == -1:
                  raise SystemExit(
                      "ERROR: Invalid AndroidManifest.xml"
                  )

              s = s[:pos + 1] + permissions + s[pos + 1:]

          receiver_block = """
              <receiver
                  android:name=".TaskReminderReceiver"
                  android:enabled="true"
                  android:exported="false" />

              <receiver
                  android:name=".TaskReminderBootReceiver"
                  android:enabled="true"
                  android:exported="true">

                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                  </intent-filter>

              </receiver>
          """

          if "TaskReminderReceiver" not in s:
              marker = "</application>"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: application block not found."
                  )

              s = s.replace(
                  marker,
                  receiver_block + "\n" + marker,
                  1
              )

          p.write_text(s, encoding="utf-8")

          print("AndroidManifest notification permissions: PASS")
          print("Reminder receivers: PASS")
          PY

      - name: Verify notification source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f \
            app/src/main/java/com/taskmaster/promax/TaskReminderReceiver.java

          test -f \
            app/src/main/java/com/taskmaster/promax/TaskReminderBootReceiver.java

          test -f \
            app/src/main/java/com/taskmaster/promax/TaskReminderScheduler.java

          grep -q \
            'android.permission.POST_NOTIFICATIONS' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'android.permission.SCHEDULE_EXACT_ALARM' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'android.permission.RECEIVE_BOOT_COMPLETED' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'TaskReminderReceiver' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'TaskReminderBootReceiver' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'setExactAndAllowWhileIdle' \
            app/src/main/java/com/taskmaster/promax/TaskReminderScheduler.java

          echo "Notification source verification: PASS"

      - name: Verify final project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -q 'versionCode 23' app/build.gradle
          grep -q 'versionName "1.1.2"' app/build.gradle
          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle
          grep -q \
            'sourceCompatibility JavaVersion.VERSION_17' \
            app/build.gradle
          grep -q \
            'targetCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/TaskEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String taskId;' \
            app/src/main/java/com/taskmaster/promax/ReminderEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/RecurringTaskEntity.java

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/taskmaster/promax/MainActivity.java
          test -f app/src/main/java/com/taskmaster/promax/TaskDao.java

          echo "FINAL PROJECT VERIFICATION: PASS"

      - name: Run preflight checks
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/preflight.py

      - name: Run final build gate
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/final_build_gate.py

      - name: Run final release audit
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/final_release_audit.py

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            tasks --all

      - name: Compile Java and Room sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " TASKMASTER PRO MAX APK BUILD"
          echo " Version      : 1.1.2"
          echo " Version Code : 23"
          echo " Notifications: ENABLED"
          echo " AlarmManager : ENABLED"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            find "$PROJECT_DIR/app/build" \
              -type f -name "*.apk" -print || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            release/TaskMasterProMax-v1.1.2-debug.apk

          sha256sum \
            release/TaskMasterProMax-v1.1.2-debug.apk \
            | tee release/SHA256SUM.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TaskMasterProMax-v1.1.2-APK
          if-no-files-found: error
          path: |
            release/TaskMasterProMax-v1.1.2-debug.apk
            release/SHA256SUM.txt

      - name: Final build success
        run: |
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo "Version      : 1.1.2"
          echo "Version Code : 23"
          echo "Notification : ENABLED"
          echo "Bell Sound   : ENABLED"
          echo "Exact Alarm  : ENABLED"
          echo "================================================"
