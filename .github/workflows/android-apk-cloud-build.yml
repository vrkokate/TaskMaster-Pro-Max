name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. ANDROID SDK 35
      # ============================================================

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. GRADLE 8.7
      # ============================================================

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"


      # ============================================================
      # 6. VERIFY JAVA / GRADLE
      # ============================================================

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          echo "========== JAVA =========="
          java -version

          echo
          echo "========== GRADLE =========="
          gradle --version


      # ============================================================
      # 7. FIND PROJECT ZIP
      #
      # Do not depend on V22/V23/V24/V25 filename.
      # ============================================================

      - name: Find TaskMaster Android project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for TaskMaster Android project..."

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
              -name 'TaskMasterProMax_Android_*.zip' \
              -printf '%f\n' \
              | sort -V
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo
            echo "ERROR: No TaskMasterProMax Android project ZIP found."
            echo
            echo "Repository contents:"
            ls -lah
            exit 1
          fi

          echo
          echo "Available project ZIP files:"
          printf '%s\n' "${ZIPS[@]}"

          ZIP_NAME="${ZIPS[${#ZIPS[@]}-1]}"

          echo
          echo "Selected project:"
          echo "$ZIP_NAME"

          echo "PROJECT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"


      # ============================================================
      # 8. VERIFY ZIP
      # ============================================================

      - name: Verify project ZIP
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ZIP"

          echo "Selected ZIP:"
          ls -lh "$PROJECT_ZIP"

          echo
          echo "SHA-256:"
          sha256sum "$PROJECT_ZIP"

          echo
          echo "Testing ZIP integrity..."

          unzip -t "$PROJECT_ZIP" >/dev/null

          echo "ZIP integrity: PASS"


      # ============================================================
      # 9. EXTRACT PROJECT
      # ============================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "Extraction completed."


      # ============================================================
      # 10. FIND GRADLE PROJECT
      # ============================================================

      - name: Determine Android project directory
        shell: bash
        run: |
          set -e

          if [ -f "extracted/project/settings.gradle" ] \
             && [ -f "extracted/project/app/build.gradle" ]; then

            PROJECT_DIR="extracted/project"

          elif [ -f "extracted/settings.gradle" ] \
             && [ -f "extracted/app/build.gradle" ]; then

            PROJECT_DIR="extracted"

          else

            echo "ERROR: Android Gradle project not found."

            echo
            echo "Extracted files:"
            find extracted -maxdepth 5 -type f | sort

            exit 1

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Android project:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 11. COMPLETE SOURCE REPAIR
      #
      # All known source/configuration fixes are applied together.
      # ============================================================

      - name: Repair and normalize complete project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          print()
          print("================================================")
          print(" TASKMASTER PRO MAX FINAL SOURCE REPAIR")
          print("================================================")


          # ========================================================
          # A. APP BUILD.GRADLE
          # ========================================================

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle not found."
              )

          s = p.read_text(encoding="utf-8")


          # Final version
          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 22',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.1.1"',
              s,
              count=1
          )


          # Java 17
          if (
              "sourceCompatibility JavaVersion.VERSION_17"
              not in s
          ):

              marker = "    buildTypes {"

              java_block = """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

          """

              if marker not in s:
                  raise SystemExit(
                      "ERROR: Cannot add Java 17 configuration."
                  )

              s = s.replace(
                  marker,
                  java_block + marker,
                  1
              )


          p.write_text(s, encoding="utf-8")

          print("APP BUILD.GRADLE: PASS")


          # ========================================================
          # B. GRADLE.PROPERTIES
          # ========================================================

          p = Path("gradle.properties")

          existing = (
              p.read_text(encoding="utf-8")
              if p.exists()
              else ""
          )

          lines = existing.splitlines()

          required = {
              "org.gradle.jvmargs":
                  "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8",

              "org.gradle.daemon":
                  "org.gradle.daemon=false",

              "org.gradle.parallel":
                  "org.gradle.parallel=false",

              "android.useAndroidX":
                  "android.useAndroidX=true",

              "android.enableJetifier":
                  "android.enableJetifier=false",

              "android.nonTransitiveRClass":
                  "android.nonTransitiveRClass=false",
          }

          for key, value in required.items():

              lines = [
                  line
                  for line in lines
                  if not line.startswith(key + "=")
              ]

              lines.append(value)

          p.write_text(
              "\n".join(lines).rstrip() + "\n",
              encoding="utf-8"
          )

          print("GRADLE.PROPERTIES: PASS")


          # ========================================================
          # C. ROOM PRIMARY KEY FIX
          # ========================================================

          entity_dir = Path(
              "app/src/main/java/com/taskmaster/promax"
          )

          room_fixes = {
              "TaskEntity.java": "id",
              "ReminderEntity.java": "taskId",
              "RecurringTaskEntity.java": "id",
          }

          for filename, field in room_fixes.items():

              p = entity_dir / filename

              if not p.exists():
                  raise SystemExit(
                      f"ERROR: Missing entity: {filename}"
                  )

              s = p.read_text(encoding="utf-8")


              # Add @NonNull import
              if (
                  "import androidx.annotation.NonNull;"
                  not in s
              ):

                  package_line = (
                      "package com.taskmaster.promax;"
                  )

                  if package_line not in s:
                      raise SystemExit(
                          f"ERROR: Package declaration missing in {filename}"
                      )

                  s = s.replace(
                      package_line,
                      package_line
                      + "\n\n"
                      + "import androidx.annotation.NonNull;",
                      1
                  )


              # Normalize primary-key declaration
              pattern = (
                  r'@PrimaryKey\s+'
                  rf'public\s+String\s+'
                  rf'{re.escape(field)}\s*;'
              )

              replacement = (
                  f"@PrimaryKey @NonNull "
                  f"public String {field};"
              )

              s = re.sub(
                  pattern,
                  replacement,
                  s,
                  count=1
              )


              # Existing already-fixed form
              if replacement not in s:
                  raise SystemExit(
                      f"ERROR: Room primary key repair failed: {filename}"
                  )


              p.write_text(s, encoding="utf-8")

              print(
                  f"ROOM PRIMARY KEY: {filename} -> PASS"
              )


          # ========================================================
          # D. CRITICAL DAO FIX
          #
          # Actual error found in latest GitHub build:
          #
          # @Query(... :now ...)
          # int countOverdue();
          #
          # Must be:
          #
          # int countOverdue(long now);
          # ========================================================

          p = entity_dir / "TaskDao.java"

          if not p.exists():
              raise SystemExit(
                  "ERROR: TaskDao.java not found."
              )

          s = p.read_text(encoding="utf-8")


          old_method = """
              @Query("SELECT COUNT(*) FROM tasks WHERE status!='COMPLETED' AND dueAt < :now")
              int countOverdue();
          """

          new_method = """
              @Query("SELECT COUNT(*) FROM tasks WHERE status!='COMPLETED' AND dueAt < :now")
              int countOverdue(long now);
          """


          if old_method in s:

              s = s.replace(
                  old_method,
                  new_method,
                  1
              )

          else:

              # Handle different whitespace formatting
              pattern = (
                  r'(@Query\("SELECT COUNT\(\*\) FROM tasks '
                  r'WHERE status!=\'COMPLETED\' AND dueAt < :now"\)'
                  r'\s*)'
                  r'int\s+countOverdue\s*\(\s*\)\s*;'
              )

              replacement = (
                  r'\1int countOverdue(long now);'
              )

              s, count = re.subn(
                  pattern,
                  replacement,
                  s,
                  count=1
              )

              if count == 0:

                  # It may already be fixed.
                  if not re.search(
                      r'int\s+countOverdue\s*\(\s*long\s+now\s*\)',
                      s
                  ):
                      raise SystemExit(
                          "ERROR: Could not repair TaskDao.countOverdue()."
                      )


          if not re.search(
              r'int\s+countOverdue\s*\(\s*long\s+now\s*\)',
              s
          ):
              raise SystemExit(
                  "ERROR: TaskDao countOverdue(long now) not found."
              )


          p.write_text(s, encoding="utf-8")

          print(
              "TASK DAO countOverdue(long now): PASS"
          )


          # ========================================================
          # E. OLD VERSION CHECK NORMALIZATION
          # ========================================================

          scripts = [
              Path("qa_check.py"),
              Path("tools/preflight.py"),
              Path("tools/final_build_gate.py"),
              Path("tools/final_release_audit.py"),
              Path("tools/release_audit.py"),
              Path("tools/release_manifest.py"),
          ]


          for p in scripts:

              if not p.exists():
                  continue

              s = p.read_text(encoding="utf-8")


              old_versions = [
                  ("versionCode 14", "versionCode 22"),
                  ("versionCode 15", "versionCode 22"),
                  ("versionCode 16", "versionCode 22"),
                  ("versionCode 20", "versionCode 22"),
                  ('versionName "1.0.3"',
                   'versionName "1.1.1"'),
                  ('versionName "1.0.4"',
                   'versionName "1.1.1"'),
                  ('versionName "1.0.5"',
                   'versionName "1.1.1"'),
                  ('versionName "1.0.9"',
                   'versionName "1.1.1"'),
                  ("v1.0.3 (14)",
                   "v1.1.1 (22)"),
                  ("v1.0.4 (15)",
                   "v1.1.1 (22)"),
                  ("v1.0.9 (20)",
                   "v1.1.1 (22)"),
              ]


              for old, new in old_versions:
                  s = s.replace(old, new)


              p.write_text(s, encoding="utf-8")


          print("OLD QA VERSION CHECKS: PASS")


          print()
          print("================================================")
          print(" COMPLETE SOURCE REPAIR: PASS")
          print(" VERSION       : 1.1.1")
          print(" VERSION CODE  : 22")
          print(" JAVA          : 17")
          print(" ROOM PK       : FIXED")
          print(" TASK DAO      : FIXED")
          print("================================================")


      # ============================================================
      # 12. FINAL SOURCE VERIFICATION
      # ============================================================

      - name: Verify final source code
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== RELEASE ====="

          grep -q 'versionCode 22' app/build.gradle
          grep -q 'versionName "1.1.1"' app/build.gradle

          echo "Release: PASS"


          echo
          echo "===== SDK ====="

          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle

          echo "SDK: PASS"


          echo
          echo "===== JAVA 17 ====="

          grep -q \
            'sourceCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          grep -q \
            'targetCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          echo "Java 17: PASS"


          echo
          echo "===== ROOM PRIMARY KEYS ====="

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/TaskEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String taskId;' \
            app/src/main/java/com/taskmaster/promax/ReminderEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/RecurringTaskEntity.java

          echo "Room primary keys: PASS"


          echo
          echo "===== TASK DAO ====="

          grep -q \
            'int countOverdue(long now)' \
            app/src/main/java/com/taskmaster/promax/TaskDao.java

          echo "TaskDao bind parameter: PASS"


          echo
          echo "===== CORE FILES ====="

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/taskmaster/promax/MainActivity.java
          test -f app/src/main/java/com/taskmaster/promax/TaskDao.java
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties

          echo "Core files: PASS"


          echo
          echo "================================================"
          echo " FINAL SOURCE VERIFICATION: PASS"
          echo "================================================"


      # ============================================================
      # 13. PREFLIGHT
      # ============================================================

      - name: Run preflight checks
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/preflight.py


      # ============================================================
      # 14. FINAL BUILD GATE
      # ============================================================

      - name: Run final build gate
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/final_build_gate.py


      # ============================================================
      # 15. FINAL RELEASE AUDIT
      # ============================================================

      - name: Run final release audit
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/final_release_audit.py


      # ============================================================
      # 16. GRADLE PROJECT TEST
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            tasks --all


      # ============================================================
      # 17. JAVA + ROOM COMPILATION TEST
      #
      # IMPORTANT:
      # This isolates Java/Room errors before APK assembly.
      # ============================================================

      - name: Compile Java and Room sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo
          echo "================================================"
          echo " JAVA + ROOM COMPILATION"
          echo "================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

          echo
          echo "JAVA + ROOM COMPILATION: PASS"


      # ============================================================
      # 18. BUILD DEBUG APK
      # ============================================================

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD"
          echo "================================================"
          echo
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

          echo
          echo "APK BUILD COMMAND COMPLETED"


      # ============================================================
      # 19. VERIFY APK
      # ============================================================

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then

            echo "ERROR: APK was not created."

            echo
            echo "Available APK files:"

            find "$PROJECT_DIR/app/build" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          echo
          echo "================================================"
          echo " APK CREATED SUCCESSFULLY"
          echo "================================================"

          ls -lh "$APK"


      # ============================================================
      # 20. PREPARE APK
      # ============================================================

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "release/TaskMasterProMax-v1.1.1-debug.apk"

          echo
          echo "APK SHA-256:"

          sha256sum \
            "release/TaskMasterProMax-v1.1.1-debug.apk" \
            | tee "release/SHA256SUM.txt"

          echo
          echo "Release files:"
          ls -lh release/


      # ============================================================
      # 21. UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error
          path: |
            release/TaskMasterProMax-v1.1.1-debug.apk
            release/SHA256SUM.txt


      # ============================================================
      # 22. FINAL SUCCESS
      # ============================================================

      - name: Final build success
        shell: bash
        run: |
          echo
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo
          echo "APK is available in GitHub Actions Artifacts."
          echo
          echo "================================================"
