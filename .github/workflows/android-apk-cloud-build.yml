name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
              -name 'TaskMasterProMax_Android_*.zip' \
              -printf '%f\n' \
              | sort -V
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No TaskMasterProMax_Android_*.zip found."
            echo
            echo "Repository root:"
            ls -lah
            exit 1
          fi

          ZIP_NAME="${ZIPS[${#ZIPS[@]}-1]}"

          echo "PROJECT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"

          echo "Selected Android project:"
          echo "$ZIP_NAME"

      - name: Verify and extract project
        shell: bash
        run: |
          set -e

          unzip -t "$PROJECT_ZIP" >/dev/null

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          if [ -f extracted/project/settings.gradle ]; then
            PROJECT_DIR="extracted/project"

          elif [ -f extracted/settings.gradle ]; then
            PROJECT_DIR="extracted"

          else
            echo "ERROR: Android Gradle project not found."

            echo
            echo "Extracted files:"
            find extracted \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

      - name: Normalize final release configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ----------------------------------------------------------
          # Release identity
          # ----------------------------------------------------------

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle not found."
              )

          text = p.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 22',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.1.1"',
              text,
              count=1
          )

          if (
              "sourceCompatibility JavaVersion.VERSION_17"
              not in text
          ):

              marker = "    buildTypes {"

              block = """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

          """

              if marker not in text:
                  raise SystemExit(
                      "ERROR: Cannot add Java 17 compileOptions."
                  )

              text = text.replace(
                  marker,
                  block + marker,
                  1
              )

          p.write_text(
              text,
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Gradle CI configuration
          # ----------------------------------------------------------

          p = Path("gradle.properties")

          existing = (
              p.read_text(
                  encoding="utf-8"
              )
              if p.exists()
              else ""
          )

          lines = existing.splitlines()

          required = {
              "org.gradle.jvmargs":
                  "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8",

              "org.gradle.daemon":
                  "org.gradle.daemon=false",

              "org.gradle.parallel":
                  "org.gradle.parallel=false",

              "android.useAndroidX":
                  "android.useAndroidX=true",

              "android.enableJetifier":
                  "android.enableJetifier=false",

              "android.nonTransitiveRClass":
                  "android.nonTransitiveRClass=false",
          }

          for key, value in required.items():

              lines = [
                  line
                  for line in lines
                  if not line.startswith(key + "=")
              ]

              lines.append(value)

          p.write_text(
              "\n".join(lines).rstrip() + "\n",
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Room String primary-key compatibility
          #
          # Do not modify TaskDao.java.
          # ----------------------------------------------------------

          entity_dir = Path(
              "app/src/main/java/com/taskmaster/promax"
          )

          fixes = {
              "TaskEntity.java": "id",
              "ReminderEntity.java": "taskId",
              "RecurringTaskEntity.java": "id",
          }

          for filename, field in fixes.items():

              p = entity_dir / filename

              if not p.exists():
                  raise SystemExit(
                      f"ERROR: Missing Room entity: {filename}"
                  )

              text = p.read_text(
                  encoding="utf-8"
              )

              if (
                  "import androidx.annotation.NonNull;"
                  not in text
              ):

                  package_line = (
                      "package com.taskmaster.promax;\n\n"
                  )

                  if package_line in text:

                      text = text.replace(
                          package_line,
                          package_line
                          + "import androidx.annotation.NonNull;\n",
                          1
                      )

              old = (
                  f"@PrimaryKey public String {field};"
              )

              new = (
                  f"@PrimaryKey @NonNull public String {field};"
              )

              text = text.replace(
                  old,
                  new
              )

              if new not in text:
                  raise SystemExit(
                      f"ERROR: Room primary-key fix failed: {filename}"
                  )

              p.write_text(
                  text,
                  encoding="utf-8"
              )

          print("FINAL NORMALIZATION: PASS")
          print("Release: 1.1.1 / 22")
          print("Java 17: PASS")
          print("Room primary keys: PASS")
          PY

      - name: Synchronize old QA release versions
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ----------------------------------------------------------
          # Current application release
          # ----------------------------------------------------------

          RELEASE_NAME = "1.1.1"
          RELEASE_CODE = "22"

          # ----------------------------------------------------------
          # QA/check scripts only.
          # Application source is NOT modified here.
          # ----------------------------------------------------------

          files = [
              Path("qa_check.py"),
              Path("tools/preflight.py"),
              Path("tools/final_build_gate.py"),
              Path("tools/final_release_audit.py"),
              Path("tools/release_audit.py"),
              Path("tools/release_manifest.py"),
          ]

          changed = []

          for path in files:

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              original = text

              # Historical release names.
              text = text.replace(
                  "1.0.3",
                  RELEASE_NAME
              )

              text = text.replace(
                  "1.0.9",
                  RELEASE_NAME
              )

              # Historical display forms.
              text = text.replace(
                  "v1.1.1 (14)",
                  "v1.1.1 (22)"
              )

              text = text.replace(
                  "v1.1.1 (20)",
                  "v1.1.1 (22)"
              )

              text = text.replace(
                  "1.1.1/14",
                  "1.1.1/22"
              )

              text = text.replace(
                  "1.1.1 / 14",
                  "1.1.1 / 22"
              )

              text = text.replace(
                  "1.1.1\\/14",
                  "1.1.1\\/22"
              )

              # Explicit version-code assignments.
              text = re.sub(
                  r'(?i)'
                  r'(versionCode\s*[=:]\s*'
                  r'|version_code\s*[=:]\s*'
                  r'|VERSION_CODE\s*[=:]\s*'
                  r'|EXPECTED_CODE\s*[=:]\s*'
                  r'|expected_code\s*[=:]\s*'
                  r'|RELEASE_CODE\s*[=:]\s*'
                  r'|release_code\s*[=:]\s*)'
                  r'["\']?(14|20)["\']?',
                  lambda m: m.group(1) + RELEASE_CODE,
                  text
              )

              # Paired values:
              # ("1.1.1", 20)
              # ("1.1.1", "20")
              # ("1.1.1"/20)
              text = re.sub(
                  r'(["\']1\.1\.1["\']\s*[,/]\s*'
                  r'["\']?)(14|20)(["\']?)',
                  r'\g<1>22\g<3>',
                  text
              )

              if text != original:

                  path.write_text(
                      text,
                      encoding="utf-8"
                  )

                  changed.append(
                      str(path)
                  )

          print(
              "QA RELEASE SYNCHRONIZATION: PASS"
          )

          if changed:

              print("Updated files:")

              for item in changed:
                  print(" -", item)

          else:

              print(
                  "No stale release identifiers needed updating."
              )
          PY

      - name: Verify QA release consistency
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("qa_check.py"),
              Path("tools/preflight.py"),
              Path("tools/final_build_gate.py"),
              Path("tools/final_release_audit.py"),
              Path("tools/release_audit.py"),
              Path("tools/release_manifest.py"),
          ]

          stale = []

          for path in files:

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              if "1.0.3" in text:
                  stale.append(
                      f"{path}: 1.0.3"
                  )

              if "1.0.9" in text:
                  stale.append(
                      f"{path}: 1.0.9"
                  )

              if re.search(
                  r'(?i)'
                  r'(versionCode\s*[=:]\s*'
                  r'|version_code\s*[=:]\s*'
                  r'|VERSION_CODE\s*[=:]\s*'
                  r'|EXPECTED_CODE\s*[=:]\s*'
                  r'|expected_code\s*[=:]\s*'
                  r'|RELEASE_CODE\s*[=:]\s*'
                  r'|release_code\s*[=:]\s*)'
                  r'["\']?(14|20)["\']?',
                  text
              ):
                  stale.append(
                      f"{path}: old version code"
                  )

              if (
                  "v1.1.1 (14)" in text
                  or "v1.1.1 (20)" in text
              ):
                  stale.append(
                      f"{path}: old version pair"
                  )

              if re.search(
                  r'["\']1\.1\.1["\']\s*[,/]\s*'
                  r'["\']?(14|20)["\']?',
                  text
              ):
                  stale.append(
                      f"{path}: old version/code pair"
                  )

          if stale:

              print(
                  "ERROR: Old QA release identifiers remain:"
              )

              for item in stale:
                  print(" -", item)

              raise SystemExit(1)

          print(
              "QA RELEASE CONSISTENCY: PASS"
          )
          PY

      - name: Verify final project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -q \
            'versionCode 22' \
            app/build.gradle

          grep -q \
            'versionName "1.1.1"' \
            app/build.gradle

          grep -q \
            'compileSdk 35' \
            app/build.gradle

          grep -q \
            'targetSdk 35' \
            app/build.gradle

          grep -q \
            'sourceCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          grep -q \
            'targetCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/TaskEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String taskId;' \
            app/src/main/java/com/taskmaster/promax/ReminderEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/RecurringTaskEntity.java

          test -f \
            app/src/main/java/com/taskmaster/promax/MainActivity.java

          test -f \
            app/src/main/AndroidManifest.xml

          echo "FINAL PROJECT VERIFICATION: PASS"

      - name: Run preflight checks
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/preflight.py

      - name: Run final build gate
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/final_build_gate.py

      - name: Run final release audit
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 tools/final_release_audit.py

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            tasks --all

      - name: Compile Java before APK build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " TASKMASTER PRO MAX APK BUILD"
          echo " Version      : 1.1.1"
          echo " Version Code : 22"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Verify APK output
        if: success()
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then

            echo "ERROR: APK was not created."

            find \
              "$PROJECT_DIR/app/build" \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1
          fi

          echo "APK CREATED:"
          ls -lh "$APK"

      - name: Verify APK signature
        if: success()
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK signature: PASS"
          echo "APK integrity: PASS"

      - name: Upload Gradle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: TaskMasterProMax-build-diagnostics
          if-no-files-found: ignore
          path: |
            gradle-build.log
            extracted/project/app/build/reports/**
            extracted/project/app/build/outputs/logs/**

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            release/TaskMasterProMax-v1.1.1-debug.apk

          sha256sum \
            release/TaskMasterProMax-v1.1.1-debug.apk \
            | tee release/SHA256SUM.txt

          ls -lh release/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error
          path: |
            release/TaskMasterProMax-v1.1.1-debug.apk
            release/SHA256SUM.txt

      - name: Final build success
        if: success()
        run: |
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo "================================================"
