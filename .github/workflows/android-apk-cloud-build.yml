name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. INSTALL ANDROID SDK 35
      # ============================================================

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING ANDROID SDK 35"
          echo "=========================================="

          sdkmanager "platforms;android-35" \
                      "build-tools;35.0.0"

          yes | sdkmanager --licenses > /dev/null || true

          echo ""
          echo "Android SDK 35: READY"


      # ============================================================
      # 5. GRADLE 8.7
      # ============================================================

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ============================================================
      # 6. VERIFY BUILD ENVIRONMENT
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "TASKMASTER PRO MAX"
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Repository:"
          pwd

          echo ""
          echo "Repository files:"
          ls -lah


      # ============================================================
      # 7. LOCATE PROJECT ZIP
      # ============================================================

      - name: Locate TaskMaster Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="TaskMasterProMax_Android_v22_Cloud_APK_Build.zip"

          echo "=========================================="
          echo "LOCATING TASKMASTER PROJECT ZIP"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then

            echo ""
            echo "ERROR: ZIP FILE NOT FOUND"
            echo ""
            echo "Expected:"
            echo "$ZIP_FILE"

            echo ""
            echo "Available ZIP files:"

            find . \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print

            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================

      - name: Extract TaskMaster Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING TASKMASTER PROJECT"
          echo "=========================================="

          rm -rf extracted

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Extraction completed."

          if [ ! -f "extracted/project/settings.gradle" ]; then

            echo ""
            echo "ERROR:"
            echo "extracted/project/settings.gradle NOT FOUND"

            echo ""
            echo "Available settings.gradle files:"

            find extracted \
              -type f \
              -name "settings.gradle" \
              -print

            exit 1
          fi

          if [ ! -f "extracted/project/app/build.gradle" ]; then

            echo ""
            echo "ERROR:"
            echo "extracted/project/app/build.gradle NOT FOUND"

            exit 1
          fi

          echo ""
          echo "PROJECT FOUND:"
          echo "extracted/project"


      # ============================================================
      # 9. NORMALIZE RELEASE CHECKS
      # ============================================================

      - name: Normalize release checks to v1.1.1
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "NORMALIZING RELEASE CHECKS"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("qa_check.py"),
              Path("tools/preflight.py"),
              Path("tools/release_audit.py"),
              Path("tools/release_manifest.py"),
              Path("tools/final_release_audit.py"),
          ]

          replacements = {
              "1.0.3/14": "1.1.1/22",
              "1.0.9/20": "1.1.1/22",
              "1.0.4/15": "1.1.1/22",

              "1.0.3 (14)": "1.1.1 (22)",
              "1.0.9 (20)": "1.1.1 (22)",
              "1.0.4 (15)": "1.1.1 (22)",

              "1.0.3": "1.1.1",
              "1.0.9": "1.1.1",
              "1.0.4": "1.1.1",

              "versionCode 14": "versionCode 22",
              "versionCode 20": "versionCode 22",
              "versionCode 15": "versionCode 22",

              'versionName "1.0.3"': 'versionName "1.1.1"',
              'versionName "1.0.9"': 'versionName "1.1.1"',
              'versionName "1.0.4"': 'versionName "1.1.1"',
          }

          for path in files:

              if not path.exists():
                  print(f"SKIP - {path}")
                  continue

              text = path.read_text(encoding="utf-8")
              original = text

              for old, new in replacements.items():
                  text = text.replace(old, new)

              path.write_text(text, encoding="utf-8")

              if text != original:
                  print(f"UPDATED - {path}")
              else:
                  print(f"OK - {path}")

          print("")
          print("Release normalization complete.")
          print("Version Name : 1.1.1")
          print("Version Code : 22")
          PY


      # ============================================================
      # 10. VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify Android project structure
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PROJECT STRUCTURE"
          echo "=========================================="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -d app/src/main
          test -f app/src/main/AndroidManifest.xml

          test -f qa_check.py
          test -f tools/preflight.py
          test -f tools/final_build_gate.py
          test -f tools/final_release_audit.py

          echo ""
          echo "PROJECT STRUCTURE: PASS"


      # ============================================================
      # 11. VERIFY RELEASE VERSION
      # ============================================================

      - name: Verify release version
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RELEASE VERSION CHECK"
          echo "=========================================="

          echo ""
          grep -n "versionCode" app/build.gradle

          echo ""
          grep -n "versionName" app/build.gradle

          grep -q 'versionCode 22' app/build.gradle
          grep -q 'versionName "1.1.1"' app/build.gradle

          echo ""
          echo "VERSION CHECK: PASS"
          echo "Version Name : 1.1.1"
          echo "Version Code : 22"


      # ============================================================
      # 12. PREFLIGHT
      # ============================================================

      - name: Run preflight checks
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING PREFLIGHT"
          echo "=========================================="

          python3 tools/preflight.py


      # ============================================================
      # 13. FINAL BUILD GATE
      # ============================================================

      - name: Run final build gate
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING FINAL BUILD GATE"
          echo "=========================================="

          python3 tools/final_build_gate.py


      # ============================================================
      # 14. FINAL RELEASE AUDIT
      # ============================================================

      - name: Run final release audit
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING FINAL RELEASE AUDIT"
          echo "=========================================="

          python3 tools/final_release_audit.py


      # ============================================================
      # 15. VERIFY GRADLE PROJECT
      # ============================================================

      - name: Verify Gradle project
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE PROJECT VALIDATION"
          echo "=========================================="

          gradle --no-daemon \
                 --stacktrace \
                 --console=plain \
                 tasks \
                 --all

          echo ""
          echo "GRADLE PROJECT: PASS"


      # ============================================================
      # 16. BUILD DEBUG APK
      # ============================================================

      - name: Build installable Debug APK
        working-directory: extracted/project
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "TASKMASTER PRO MAX - APK BUILD"
          echo "=========================================="

          echo ""
          echo "Running Gradle assembleDebug..."
          echo ""

          gradle --no-daemon \
                 --stacktrace \
                 --console=plain \
                 :app:assembleDebug \
                 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "GRADLE EXIT CODE: $BUILD_STATUS"
          echo "=========================================="

          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo ""
            echo "APK BUILD COMMAND: SUCCESS"
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "APK BUILD FAILED"
          echo "=========================================="

          echo ""
          echo "========== WHAT WENT WRONG =========="
          echo ""

          grep -n -A 20 -B 8 \
            "What went wrong" \
            build.log || true

          echo ""
          echo "========== EXECUTION FAILED =========="
          echo ""

          grep -n -A 20 -B 8 \
            "Execution failed" \
            build.log || true

          echo ""
          echo "========== COMPILATION ERRORS =========="
          echo ""

          grep -n -E \
            "error:|ERROR:|cannot find symbol|does not exist|Could not resolve|Duplicate class|Manifest merger failed|resource .* not found|uses-sdk|failed" \
            build.log \
            | tail -150 || true

          echo ""
          echo "========== LAST 200 LINES =========="
          echo ""

          tail -200 build.log

          echo ""
          echo "=========================================="
          echo "END OF BUILD DIAGNOSTICS"
          echo "=========================================="

          exit "$BUILD_STATUS"


      # ============================================================
      # 17. VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "APK VERIFICATION"
          echo "=========================================="

          if [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR: APK WAS NOT CREATED."

            echo ""
            echo "AVAILABLE APK FILES:"

            find app/build \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          if [ ! -s "$APK" ]; then

            echo ""
            echo "ERROR: APK FILE IS EMPTY."

            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESS"
          echo ""

          ls -lh "$APK"


      # ============================================================
      # 18. COPY APK
      # ============================================================

      - name: Copy APK to workspace
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          OUTPUT="$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk"

          cp "$APK" "$OUTPUT"

          echo ""
          echo "APK COPIED SUCCESSFULLY"

          ls -lh "$OUTPUT"


      # ============================================================
      # 19. SHA-256
      # ============================================================

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk"

          SHA="$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk.sha256"

          echo "=========================================="
          echo "GENERATING SHA-256"
          echo "=========================================="

          sha256sum "$APK" | tee "$SHA"

          echo ""
          echo "SHA-256 GENERATED"


      # ============================================================
      # 20. FINAL APK INTEGRITY CHECK
      # ============================================================

      - name: Final APK integrity check
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk"

          SHA="$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk.sha256"

          test -s "$APK"
          test -s "$SHA"

          echo "=========================================="
          echo "FINAL APK INTEGRITY CHECK"
          echo "=========================================="

          echo ""
          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "SHA-256:"
          cat "$SHA"

          echo ""
          echo "INTEGRITY CHECK: PASS"


      # ============================================================
      # 21. UPLOAD APK ARTIFACT
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error
          path: |
            TaskMasterProMax-v1.1.1-debug.apk
            TaskMasterProMax-v1.1.1-debug.apk.sha256


      # ============================================================
      # 22. FINAL SUCCESS
      # ============================================================

      - name: FINAL SUCCESS
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "          TASKMASTER PRO MAX"
          echo "          APK BUILD SUCCESS"
          echo "=================================================="
          echo ""
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo ""
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo "Artifact     : TaskMasterProMax-v1.1.1-APK"
          echo ""
          echo "=================================================="
          echo "          BUILD COMPLETED SUCCESSFULLY"
          echo "=================================================="
