name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK 35
      # ============================================================

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 installed successfully."


      # ============================================================
      # 5. GRADLE 8.7
      # ============================================================

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ============================================================
      # 6. VERIFY JAVA / GRADLE
      # ============================================================

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo
          echo "===== GRADLE ====="
          gradle --version


      # ============================================================
      # 7. FIND ANDROID PROJECT ZIP
      #
      # IMPORTANT:
      # Do NOT use V22/V23/V24 exact filename.
      # The workflow automatically finds the newest
      # TaskMasterProMax_Android_*.zip in repository root.
      # ============================================================

      - name: Find TaskMaster Android project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching repository root for Android project ZIP..."

          ZIP=$(find . \
            -maxdepth 1 \
            -type f \
            -name 'TaskMasterProMax_Android_*.zip' \
            -printf '%f\n' \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo
            echo "ERROR: No TaskMaster Android project ZIP found."
            echo
            echo "Repository root contents:"
            ls -lah
            exit 1
          fi

          echo
          echo "=============================================="
          echo "ANDROID PROJECT ZIP SELECTED"
          echo "=============================================="
          echo "$ZIP"
          echo

          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"

          echo "ZIP SHA-256:"
          sha256sum "$ZIP"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================

      - name: Extract Android project
        env:
          ZIP_NAME: ${{ steps.find_zip.outputs.zip_name }}
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_NAME"

          unzip -q "$ZIP_NAME" -d extracted

          echo
          echo "Checking extracted project..."

          if [ ! -f extracted/project/settings.gradle ]; then
            echo "ERROR: settings.gradle not found."
            echo
            find extracted -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          if [ ! -f extracted/project/app/build.gradle ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "Project extraction: PASS"


      # ============================================================
      # 9. SYNCHRONIZE RELEASE VERSION
      #
      # This prevents old V22 QA scripts from stopping the build
      # because of historical version numbers.
      # ============================================================

      - name: Synchronize release version 1.1.1 / 22
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "Synchronizing release metadata..."

          # --------------------------------------------------------
          # app/build.gradle
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 22',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.1.1"',
              s,
              count=1
          )

          p.write_text(s, encoding="utf-8")
          PY


          # --------------------------------------------------------
          # Known QA / release helper scripts
          # --------------------------------------------------------

          for FILE in \
            qa_check.py \
            tools/preflight.py \
            tools/final_build_gate.py \
            tools/final_release_audit.py \
            tools/release_audit.py \
            tools/release_manifest.py
          do
            if [ -f "$FILE" ]; then

              sed -i \
                -e 's/versionCode 20/versionCode 22/g' \
                -e 's/versionCode 14/versionCode 22/g' \
                -e 's/versionCode 15/versionCode 22/g' \
                -e 's/versionCode 1/versionCode 22/g' \
                -e 's/1\.0\.9/1.1.1/g' \
                -e 's/1\.0\.4/1.1.1/g' \
                -e 's/1\.0\.3/1.1.1/g' \
                "$FILE"

              echo "Synchronized: $FILE"
            fi
          done


          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------

          cat > gradle.properties <<'EOF'
# TaskMaster Pro Max CI configuration

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
EOF


          echo
          echo "Release synchronization completed."


      # ============================================================
      # 10. FORCE JAVA 17 COMPILE OPTIONS
      # ============================================================

      - name: Verify and enforce Java 17 compile options
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          if "compileOptions" not in s:
              marker = "android {"
              block = """android {
          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }
          """
              if marker not in s:
                  raise SystemExit("ERROR: android block not found in app/build.gradle")

              s = s.replace(marker, block, 1)

          elif "sourceCompatibility JavaVersion.VERSION_17" not in s:
              marker = "compileOptions {"
              replacement = """compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          """
              if marker not in s:
                  raise SystemExit("ERROR: compileOptions block could not be located")

              start = s.index(marker)
              end = s.index("}", start)

              old = s[start:end+1]

              s = s[:start] + replacement + "\n          }" + s[end+1:]

          p.write_text(s, encoding="utf-8")
          PY

          echo
          echo "Java 17 compile configuration:"
          grep -A5 -B1 "compileOptions" app/build.gradle || true


      # ============================================================
      # 11. VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify Android project structure
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/taskmaster/promax/MainActivity.java

          echo "=============================================="
          echo "PROJECT STRUCTURE: PASS"
          echo "=============================================="


      # ============================================================
      # 12. VERIFY VERSION
      # ============================================================

      - name: Verify release version
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          grep -q 'versionCode 22' app/build.gradle
          grep -q 'versionName "1.1.1"' app/build.gradle

          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo "Release verification: PASS"


      # ============================================================
      # 13. VERIFY JAVA 17
      # ============================================================

      - name: Verify Java 17 configuration
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          grep -q 'sourceCompatibility JavaVersion.VERSION_17' app/build.gradle
          grep -q 'targetCompatibility JavaVersion.VERSION_17' app/build.gradle
          grep -q 'org.gradle.jvmargs' gradle.properties

          echo "Java 17 configuration: PASS"


      # ============================================================
      # 14. PREFLIGHT
      # ============================================================

      - name: Run preflight checks
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          python3 tools/preflight.py


      # ============================================================
      # 15. FINAL BUILD GATE
      # ============================================================

      - name: Run final build gate
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          python3 tools/final_build_gate.py


      # ============================================================
      # 16. FINAL RELEASE AUDIT
      # ============================================================

      - name: Run final release audit
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          python3 tools/final_release_audit.py


      # ============================================================
      # 17. GRADLE PROJECT TEST
      # ============================================================

      - name: Verify Gradle project
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            tasks --all


      # ============================================================
      # 18. BUILD APK
      # ============================================================

      - name: Build installable Debug APK
        working-directory: extracted/project
        shell: bash
        run: |
          set -o pipefail

          echo
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD"
          echo " Version      : 1.1.1"
          echo " Version Code : 22"
          echo "================================================"
          echo

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          echo
          echo "APK BUILD COMMAND COMPLETED."


      # ============================================================
      # 19. VERIFY APK
      # ============================================================

      - name: Verify APK output
        if: success()
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            echo
            echo "Available build files:"
            find app/build -type f | sort || true
            exit 1
          fi

          echo
          echo "=============================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=============================================="
          ls -lh "$APK"


      # ============================================================
      # 20. PREPARE RELEASE
      # ============================================================

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            extracted/project/app/build/outputs/apk/debug/app-debug.apk \
            release/TaskMasterProMax-v1.1.1-debug.apk

          sha256sum \
            release/TaskMasterProMax-v1.1.1-debug.apk \
            | tee release/SHA256SUM.txt

          echo
          echo "Release package:"
          ls -lh release/


      # ============================================================
      # 21. UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error
          path: |
            release/TaskMasterProMax-v1.1.1-debug.apk
            release/SHA256SUM.txt


      # ============================================================
      # 22. FAILURE DIAGNOSTICS
      #
      # If Gradle fails, preserve the actual log and reports.
      # ============================================================

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TaskMasterProMax-build-diagnostics
          if-no-files-found: ignore
          path: |
            gradle-build.log
            extracted/project/app/build/reports/**
            extracted/project/app/build/outputs/logs/**


      # ============================================================
      # 23. FINAL SUCCESS
      # ============================================================

      - name: Final success
        if: success()
        shell: bash
        run: |
          echo
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo
          echo "APK is available in GitHub Actions Artifacts."
          echo
          echo "================================================"
