name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. INSTALL REQUIRED ANDROID SDK PACKAGES
      # ============================================================

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. VERIFY V23 ZIP
      # ============================================================

      - name: Verify V23 Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP="TaskMasterProMax_Android_v23_BuildFix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in repository root."
            echo
            echo "Files available in repository:"
            ls -lah
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP"

          echo
          echo "SHA-256:"
          sha256sum "$ZIP"


      # ============================================================
      # 6. EXTRACT PROJECT
      # ============================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "TaskMasterProMax_Android_v23_BuildFix.zip" \
            -d extracted

          echo "Extracted project:"
          find extracted/project -maxdepth 2 -type f | sort | head -100


      # ============================================================
      # 7. VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify Android project structure
        shell: bash
        working-directory: extracted/project
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/taskmaster/promax/MainActivity.java

          echo "Android project structure: OK"


      # ============================================================
      # 8. VERIFY RELEASE VERSION
      # ============================================================

      - name: Verify release version
        shell: bash
        working-directory: extracted/project
        run: |
          set -e

          grep -q 'versionCode 22' app/build.gradle
          grep -q 'versionName "1.1.1"' app/build.gradle

          echo "Version verified:"
          grep -E 'versionCode|versionName' app/build.gradle


      # ============================================================
      # 9. VERIFY JAVA 17 CONFIGURATION
      # ============================================================

      - name: Verify Java 17 configuration
        shell: bash
        working-directory: extracted/project
        run: |
          set -e

          grep -q 'sourceCompatibility JavaVersion.VERSION_17' app/build.gradle
          grep -q 'targetCompatibility JavaVersion.VERSION_17' app/build.gradle

          grep -q 'org.gradle.jvmargs' gradle.properties

          echo "Java 17 / Gradle configuration: OK"


      # ============================================================
      # 10. RUN PREFLIGHT
      # ============================================================

      - name: Run preflight checks
        shell: bash
        working-directory: extracted/project
        run: |
          set -e

          python3 tools/preflight.py


      # ============================================================
      # 11. RUN FINAL BUILD GATE
      # ============================================================

      - name: Run final build gate
        shell: bash
        working-directory: extracted/project
        run: |
          set -e

          python3 tools/final_build_gate.py


      # ============================================================
      # 12. RUN FINAL RELEASE AUDIT
      # ============================================================

      - name: Run final release audit
        shell: bash
        working-directory: extracted/project
        run: |
          set -e

          python3 tools/final_release_audit.py


      # ============================================================
      # 13. VERIFY GRADLE PROJECT
      # ============================================================

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ============================================================
      # 14. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        working-directory: extracted/project
        run: |
          set -e

          gradle --version

          gradle --no-daemon \
            --stacktrace \
            tasks --all


      # ============================================================
      # 15. BUILD DEBUG APK
      # ============================================================

      - name: Build installable Debug APK
        shell: bash
        working-directory: extracted/project
        run: |
          set -e

          echo "============================================"
          echo "Building TaskMaster Pro Max Debug APK"
          echo "============================================"

          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

          echo
          echo "BUILD COMPLETED"


      # ============================================================
      # 16. VERIFY APK
      # ============================================================

      - name: Verify APK output
        shell: bash
        working-directory: extracted/project
        run: |
          set -e

          APK_DIR="app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found."
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "ERROR: No APK file was produced."
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK files:"
          find "$APK_DIR" -type f -name "*.apk" -exec ls -lh {} \;


      # ============================================================
      # 17. PREPARE APK
      # ============================================================

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find extracted/project/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" "release/TaskMasterProMax-v1.1.1-debug.apk"

          ls -lh release/


      # ============================================================
      # 18. GENERATE SHA-256
      # ============================================================

      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -e

          sha256sum release/TaskMasterProMax-v1.1.1-debug.apk \
            | tee release/SHA256SUM.txt

          echo
          echo "APK SHA-256 generated."


      # ============================================================
      # 19. UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskMasterProMax-v1.1.1-APK
          path: |
            release/TaskMasterProMax-v1.1.1-debug.apk
            release/SHA256SUM.txt
          if-no-files-found: error


      # ============================================================
      # 20. FINAL SUCCESS
      # ============================================================

      - name: Final build success
        shell: bash
        run: |
          echo
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo
          echo "Version : 1.1.1"
          echo "Version Code : 22"
          echo "APK : TaskMasterProMax-v1.1.1-debug.apk"
          echo
          echo "The APK is available in GitHub Actions Artifacts."
          echo
