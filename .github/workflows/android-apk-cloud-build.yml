name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e
          java -version
          gradle --version

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
              -name 'TaskMasterProMax_Android_*.zip' \
              -printf '%f\n' | sort -V
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No TaskMasterProMax_Android_*.zip found."
            ls -lah
            exit 1
          fi

          ZIP_NAME="${ZIPS[${#ZIPS[@]}-1]}"
          echo "PROJECT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "Selected: $ZIP_NAME"

      - name: Verify and extract project
        shell: bash
        run: |
          set -e

          unzip -t "$PROJECT_ZIP" >/dev/null
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$PROJECT_ZIP" -d extracted

          if [ -f extracted/project/settings.gradle ]; then
            echo "PROJECT_DIR=extracted/project" >> "$GITHUB_ENV"
          elif [ -f extracted/settings.gradle ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          else
            echo "ERROR: Android Gradle project not found."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Normalize final release configuration
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ----------------------------------------------------------
          # Release identity
          # ----------------------------------------------------------
          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 22',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.1.1"',
              s,
              count=1
          )

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              marker = "    buildTypes {"

              block = """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

          """

              if marker not in s:
                  raise SystemExit(
                      "ERROR: Cannot add Java 17 compileOptions."
                  )

              s = s.replace(
                  marker,
                  block + marker,
                  1
              )

          p.write_text(
              s,
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Gradle CI configuration
          # ----------------------------------------------------------
          p = Path("gradle.properties")

          existing = (
              p.read_text(encoding="utf-8")
              if p.exists()
              else ""
          )

          lines = existing.splitlines()

          required = {
              "org.gradle.jvmargs":
                  "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8",

              "org.gradle.daemon":
                  "org.gradle.daemon=false",

              "org.gradle.parallel":
                  "org.gradle.parallel=false",

              "android.useAndroidX":
                  "android.useAndroidX=true",

              "android.enableJetifier":
                  "android.enableJetifier=false",

              "android.nonTransitiveRClass":
                  "android.nonTransitiveRClass=false",
          }

          for key, value in required.items():

              lines = [
                  x for x in lines
                  if not x.startswith(key + "=")
              ]

              lines.append(value)

          p.write_text(
              "\n".join(lines).rstrip() + "\n",
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Room primary-key nullability repair
          # ----------------------------------------------------------
          entity_dir = Path(
              "app/src/main/java/com/taskmaster/promax"
          )

          fixes = {
              "TaskEntity.java": "id",
              "ReminderEntity.java": "taskId",
              "RecurringTaskEntity.java": "id",
          }

          for filename, field in fixes.items():

              p = entity_dir / filename

              if not p.exists():
                  raise SystemExit(
                      f"ERROR: Missing Room entity: {filename}"
                  )

              s = p.read_text(
                  encoding="utf-8"
              )

              if (
                  "import androidx.annotation.NonNull;"
                  not in s
              ):

                  s = s.replace(
                      "package com.taskmaster.promax;\n\n",
                      "package com.taskmaster.promax;\n\n"
                      "import androidx.annotation.NonNull;\n"
                  )

              s = s.replace(
                  f"@PrimaryKey public String {field};",
                  f"@PrimaryKey @NonNull public String {field};"
              )

              if (
                  f"@PrimaryKey @NonNull public String {field};"
                  not in s
              ):

                  raise SystemExit(
                      f"ERROR: Room @NonNull primary-key fix failed: {filename}"
                  )

              p.write_text(
                  s,
                  encoding="utf-8"
              )

          print("FINAL NORMALIZATION: PASS")
          print("Room String primary-key nullability: PASS")
          PY

      - name: Verify final project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          grep -q 'versionCode 22' app/build.gradle

          grep -q 'versionName "1.1.1"' app/build.gradle

          grep -q 'compileSdk 35' app/build.gradle

          grep -q 'targetSdk 35' app/build.gradle

          grep -q \
            'sourceCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          grep -q \
            'targetCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/TaskEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String taskId;' \
            app/src/main/java/com/taskmaster/promax/ReminderEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/RecurringTaskEntity.java

          test -f \
            app/src/main/java/com/taskmaster/promax/MainActivity.java

          test -f \
            app/src/main/AndroidManifest.xml

          echo "FINAL PROJECT VERIFICATION: PASS"

      - name: Run preflight checks
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/preflight.py

      - name: Run final build gate
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/final_build_gate.py

      - name: Run final release audit
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/final_release_audit.py

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle \
            --no-daemon \
            --stacktrace \
            tasks --all

      - name: Compile Java before full APK build
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " TASKMASTER PRO MAX APK BUILD"
          echo " Version      : 1.1.1"
          echo " Version Code : 22"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."

            find "$PROJECT_DIR/app/build" \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1
          fi

          echo "APK CREATED:"
          ls -lh "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            release/TaskMasterProMax-v1.1.1-debug.apk

          sha256sum \
            release/TaskMasterProMax-v1.1.1-debug.apk \
            | tee release/SHA256SUM.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error
          path: |
            release/TaskMasterProMax-v1.1.1-debug.apk
            release/SHA256SUM.txt

      - name: Final build success
        run: |
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo "================================================"
