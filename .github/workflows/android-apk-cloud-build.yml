name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:

    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. ANDROID SDK 35
      # ============================================================

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          sdkmanager "platforms;android-35" \
                      "build-tools;35.0.0"

          yes | sdkmanager --licenses > /dev/null || true

          echo "Android SDK 35 ready"


      # ============================================================
      # 5. GRADLE 8.7
      # ============================================================

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ============================================================
      # 6. SHOW ENVIRONMENT
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "TASKMASTER PRO MAX"
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Repository:"
          pwd

          echo ""
          echo "Repository files:"
          ls -lah


      # ============================================================
      # 7. LOCATE FINAL PROJECT ZIP
      # ============================================================

      - name: Locate TaskMaster Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="TaskMasterProMax_Android_v22_FINAL_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then

            echo "ERROR:"
            echo "Required project ZIP was not found."
            echo ""
            echo "Expected:"
            echo "$ZIP_FILE"
            echo ""
            echo "ZIP files available at repository root:"

            find . \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print

            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================

      - name: Extract TaskMaster Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Extracted files:"
          find extracted \
            -maxdepth 3 \
            -type f \
            | head -100

          if [ ! -f "extracted/project/settings.gradle" ]; then
            echo ""
            echo "ERROR:"
            echo "Android project settings.gradle was not found."

            find extracted \
              -maxdepth 5 \
              -type f \
              -name "settings.gradle" \
              -print

            exit 1
          fi

          if [ ! -f "extracted/project/app/build.gradle" ]; then
            echo ""
            echo "ERROR:"
            echo "Android app/build.gradle was not found."

            find extracted \
              -maxdepth 6 \
              -type f \
              -path "*/app/build.gradle" \
              -print

            exit 1
          fi

          echo ""
          echo "PROJECT FOUND:"
          echo "extracted/project"


      # ============================================================
      # 9. VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify Android project structure
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT STRUCTURE CHECK"
          echo "=========================================="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          test -d app/src/main

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/taskmaster/promax/MainActivity.java

          test -f app/src/main/assets/index.html

          echo ""
          echo "Project structure: PASS"


      # ============================================================
      # 10. VERIFY VERSION
      # ============================================================

      - name: Verify release version
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RELEASE VERSION CHECK"
          echo "=========================================="

          echo ""
          echo "versionCode:"
          grep -n "versionCode" app/build.gradle

          echo ""
          echo "versionName:"
          grep -n "versionName" app/build.gradle

          echo ""

          grep -q 'versionCode 22' app/build.gradle

          grep -q 'versionName "1.1.1"' app/build.gradle

          echo "VERSION CHECK: PASS"
          echo "Version Name : 1.1.1"
          echo "Version Code : 22"


      # ============================================================
      # 11. PREFLIGHT
      # ============================================================

      - name: Run preflight checks
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING PREFLIGHT"
          echo "=========================================="

          python3 tools/preflight.py


      # ============================================================
      # 12. FINAL BUILD GATE
      # ============================================================

      - name: Run final build gate
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING FINAL BUILD GATE"
          echo "=========================================="

          python3 tools/final_build_gate.py


      # ============================================================
      # 13. FINAL RELEASE AUDIT
      # ============================================================

      - name: Run final release audit
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING FINAL RELEASE AUDIT"
          echo "=========================================="

          python3 tools/final_release_audit.py


      # ============================================================
      # 14. VERIFY GRADLE PROJECT
      # ============================================================

      - name: Verify Gradle project
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE PROJECT CHECK"
          echo "=========================================="

          gradle --no-daemon \
                 --stacktrace \
                 tasks \
                 --all \
                 > gradle_tasks.txt

          echo ""
          echo "Gradle project check: PASS"


      # ============================================================
      # 15. BUILD DEBUG APK
      # ============================================================

      - name: Build installable Debug APK
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING TASKMASTER PRO MAX APK"
          echo "=========================================="

          gradle --no-daemon \
                 --stacktrace \
                 :app:assembleDebug

          echo ""
          echo "Gradle APK build completed."


      # ============================================================
      # 16. VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "APK VERIFICATION"
          echo "=========================================="

          if [ ! -f "$APK" ]; then

            echo "ERROR:"
            echo "APK was not created."

            echo ""
            echo "Available APK files:"

            find app/build \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESS"

          echo ""
          echo "APK:"
          ls -lh "$APK"


      # ============================================================
      # 17. COPY APK TO WORKSPACE
      # ============================================================

      - name: Copy APK to workspace
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          cp "$APK" \
             "$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk"

          ls -lh \
             "$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk"


      # ============================================================
      # 18. GENERATE SHA-256
      # ============================================================

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk"

          SHA="$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk.sha256"

          echo "=========================================="
          echo "SHA-256 CHECKSUM"
          echo "=========================================="

          sha256sum "$APK" | tee "$SHA"

          echo ""
          echo "Checksum file:"
          cat "$SHA"


      # ============================================================
      # 19. FINAL APK CHECK
      # ============================================================

      - name: Final APK integrity check
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk"

          SHA="$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk.sha256"

          test -s "$APK"

          test -s "$SHA"

          echo ""
          echo "APK integrity check: PASS"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo ""
          echo "SHA-256:"
          cat "$SHA"


      # ============================================================
      # 20. UPLOAD APK ARTIFACT
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error

          path: |
            TaskMasterProMax-v1.1.1-debug.apk
            TaskMasterProMax-v1.1.1-debug.apk.sha256


      # ============================================================
      # 21. FINAL SUCCESS
      # ============================================================

      - name: FINAL SUCCESS
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "        TASKMASTER PRO MAX"
          echo "        APK BUILD SUCCESS"
          echo "=================================================="
          echo ""
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo ""
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo "Artifact     : TaskMasterProMax-v1.1.1-APK"
          echo ""
          echo "=================================================="
