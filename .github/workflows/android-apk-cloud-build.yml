name: TaskMaster Pro Max - Cloud APK Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          sdkmanager "platforms;android-35" "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate TaskMaster Pro Max project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="TaskMasterProMax_Android_v22_FINAL_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required project ZIP was not found."
            echo ""
            echo "Expected file:"
            echo "$ZIP_FILE"
            echo ""
            echo "ZIP files found at repository root:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted project structure:"
          find extracted -maxdepth 3 -type f \
            \( -name 'settings.gradle' -o -name 'build.gradle' \) \
            -print

          if [ ! -f "extracted/project/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "extracted/project/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=extracted/project" >> "$GITHUB_ENV"

      - name: Verify TaskMaster Pro Max release version
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "Checking release version..."

          grep -n "versionCode" app/build.gradle
          grep -n "versionName" app/build.gradle

          grep -q 'versionCode 22' app/build.gradle
          grep -q 'versionName "1.1.1"' app/build.gradle

          echo ""
          echo "PASS"
          echo "TaskMaster Pro Max"
          echo "Version Name : 1.1.1"
          echo "Version Code: 22"

      - name: Run preflight checks
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING PREFLIGHT CHECKS"
          echo "=========================================="

          python3 tools/preflight.py

      - name: Run final build gate
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING FINAL BUILD GATE"
          echo "=========================================="

          python3 tools/final_build_gate.py

      - name: Run final release audit
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING FINAL RELEASE AUDIT"
          echo "=========================================="

          python3 tools/final_release_audit.py

      - name: Verify Gradle environment
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      - name: Build installable Android APK
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING TASKMASTER PRO MAX APK"
          echo "=========================================="

          gradle --no-daemon :app:assembleDebug

      - name: Verify APK was created
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          echo "=========================================="
          echo "APK BUILD SUCCESS"
          echo "=========================================="

          ls -lh "$APK"

      - name: Copy APK to workspace
        working-directory: extracted/project
        shell: bash
        run: |
          set -e

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -e

          sha256sum \
            "$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk" \
            | tee \
            "$GITHUB_WORKSPACE/TaskMasterProMax-v1.1.1-debug.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error
          path: |
            TaskMasterProMax-v1.1.1-debug.apk
            TaskMasterProMax-v1.1.1-debug.apk.sha256

      - name: Build completed successfully
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "TASKMASTER PRO MAX"
          echo "APK BUILD SUCCESS"
          echo "=========================================="
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo "Artifact     : TaskMasterProMax-v1.1.1-APK"
          echo "=========================================="
