name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e
          java -version
          gradle --version

      - name: Find TaskMaster Android project ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f \
              -name 'TaskMasterProMax_Android_*.zip' \
              -printf '%f\n' \
              | sort -V
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No TaskMasterProMax Android project ZIP found."
            ls -lah
            exit 1
          fi

          ZIP_NAME="${ZIPS[${#ZIPS[@]}-1]}"

          echo "PROJECT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"

          echo "Selected Android project:"
          echo "$ZIP_NAME"

      - name: Verify project ZIP
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ZIP"

          unzip -t "$PROJECT_ZIP" >/dev/null

          echo "ZIP integrity: PASS"
          sha256sum "$PROJECT_ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "Project extraction: PASS"

      - name: Determine Android project directory
        shell: bash
        run: |
          set -e

          if [ -f "extracted/project/settings.gradle" ] \
             && [ -f "extracted/project/app/build.gradle" ]; then

            PROJECT_DIR="extracted/project"

          elif [ -f "extracted/settings.gradle" ] \
             && [ -f "extracted/app/build.gradle" ]; then

            PROJECT_DIR="extracted"

          else

            echo "ERROR: Android Gradle project not found."
            find extracted -maxdepth 5 -type f | sort
            exit 1

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Normalize release version and CI configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          print("================================================")
          print(" TASKMASTER PRO MAX FINAL NORMALIZATION")
          print("================================================")

          # ----------------------------------------------------------
          # APP BUILD.GRADLE
          # ----------------------------------------------------------

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle not found.")

          s = p.read_text(encoding="utf-8")

          # Keep the same package/application and increase release
          # version so the APK can be installed as an update.
          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 23',
              s,
              count=1
          )

          if re.search(r'versionName\s+"[^"]+"', s):
              s = re.sub(
                  r'versionName\s+"[^"]+"',
                  'versionName "1.1.2"',
                  s,
                  count=1
              )
          else:
              marker = "    buildTypes {"
              if marker in s:
                  s = s.replace(
                      marker,
                      '    versionName "1.1.2"\n\n' + marker,
                      1
                  )

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:

              marker = "    buildTypes {"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: Cannot insert Java 17 configuration."
                  )

              java_block = """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

          """

              s = s.replace(
                  marker,
                  java_block + marker,
                  1
              )

          p.write_text(s, encoding="utf-8")

          # ----------------------------------------------------------
          # GRADLE.PROPERTIES
          # ----------------------------------------------------------

          p = Path("gradle.properties")

          existing = (
              p.read_text(encoding="utf-8")
              if p.exists()
              else ""
          )

          lines = existing.splitlines()

          required = {
              "org.gradle.jvmargs":
                  "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8",

              "org.gradle.daemon":
                  "org.gradle.daemon=false",

              "org.gradle.parallel":
                  "org.gradle.parallel=false",

              "android.useAndroidX":
                  "android.useAndroidX=true",

              "android.enableJetifier":
                  "android.enableJetifier=false",

              "android.nonTransitiveRClass":
                  "android.nonTransitiveRClass=false",
          }

          for key, value in required.items():

              lines = [
                  line
                  for line in lines
                  if not line.startswith(key + "=")
              ]

              lines.append(value)

          p.write_text(
              "\n".join(lines).rstrip() + "\n",
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # ROOM PRIMARY KEY FIX
          # ----------------------------------------------------------

          entity_dir = Path(
              "app/src/main/java/com/taskmaster/promax"
          )

          fixes = {
              "TaskEntity.java": "id",
              "ReminderEntity.java": "taskId",
              "RecurringTaskEntity.java": "id",
          }

          for filename, field in fixes.items():

              p = entity_dir / filename

              if not p.exists():
                  raise SystemExit(
                      f"ERROR: Missing entity: {filename}"
                  )

              s = p.read_text(encoding="utf-8")

              if "import androidx.annotation.NonNull;" not in s:

                  package_line = (
                      "package com.taskmaster.promax;"
                  )

                  if package_line not in s:
                      raise SystemExit(
                          f"ERROR: Package declaration missing: {filename}"
                      )

                  s = s.replace(
                      package_line,
                      package_line
                      + "\n\n"
                      + "import androidx.annotation.NonNull;",
                      1
                  )

              s = re.sub(
                  rf'@PrimaryKey\s+public\s+String\s+{re.escape(field)}\s*;',
                  f'@PrimaryKey @NonNull public String {field};',
                  s,
                  count=1
              )

              if (
                  f"@PrimaryKey @NonNull public String {field};"
                  not in s
              ):
                  raise SystemExit(
                      f"ERROR: Room primary key repair failed: {filename}"
                  )

              p.write_text(s, encoding="utf-8")

          # ----------------------------------------------------------
          # TASK DAO FIX
          # ----------------------------------------------------------

          p = entity_dir / "TaskDao.java"

          if not p.exists():
              raise SystemExit("ERROR: TaskDao.java not found.")

          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'(@Query"SELECT COUNT\(\* FROM tasks '
              r'WHERE status!=\'COMPLETED\' AND dueAt < :now"\)'
              r'\s*)'
              r'int\s+countOverdue\s*\s*\s*;',
              r'\1int countOverdue(long now);',
              s,
              count=1
          )

          if not re.search(
              r'int\s+countOverdue\s*\s*long\s+now\s*',
              s
          ):
              raise SystemExit(
                  "ERROR: TaskDao countOverdue(long now) not found."
              )

          p.write_text(s, encoding="utf-8")

          # ----------------------------------------------------------
          # IMPORTANT:
          # Repair ALL OLD VERSION CHECKS INSIDE THE PROJECT TO MATCH
          # THE CURRENT APK VERSION.
          #
          # This directly fixes the error shown in the screenshot:
          # FAIL - Release version 1.0.3/14
          # ----------------------------------------------------------

          script_paths = [
              Path("qa_check.py"),
              Path("tools/preflight.py"),
              Path("tools/final_build_gate.py"),
              Path("tools/final_release_audit.py"),
              Path("tools/release_audit.py"),
              Path("tools/release_manifest.py"),
          ]

          old_version_names = [
              "1.0.1",
              "1.0.2",
              "1.0.3",
              "1.0.4",
              "1.0.5",
              "1.0.6",
              "1.0.7",
              "1.0.8",
              "1.0.9",
              "1.1.0",
              "1.1.1",
          ]

          old_version_codes = [
              "14",
              "15",
              "16",
              "17",
              "18",
              "19",
              "20",
              "21",
              "22",
          ]

          for p in script_paths:

              if not p.exists():
                  continue

              s = p.read_text(encoding="utf-8")

              for old in old_version_names:
                  s = s.replace(
                      f'versionName "{old}"',
                      'versionName "1.1.2"'
                  )

                  s = s.replace(
                      f"versionName '{old}'",
                      "versionName '1.1.2'"
                  )

              for old in old_version_codes:
                  s = s.replace(
                      f"versionCode {old}",
                      "versionCode 23"
                  )

              s = s.replace(
                  "Release version 1.0.3/14",
                  "Release version 1.1.2/23"
              )

              s = s.replace(
                  "Release version 1.1.1/22",
                  "Release version 1.1.2/23"
              )

              s = s.replace(
                  "v1.0.3 (14)",
                  "v1.1.2 (23)"
              )

              s = s.replace(
                  "v1.0.4 (15)",
                  "v1.1.2 (23)"
              )

              s = s.replace(
                  "v1.0.9 (20)",
                  "v1.1.2 (23)"
              )

              p.write_text(s, encoding="utf-8")

          print("Release normalization: PASS")
          print("Room normalization: PASS")
          print("TaskDao normalization: PASS")
          print("Old-version QA normalization: PASS")
          PY

      - name: Enable and verify Android notifications
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MANIFEST="app/src/main/AndroidManifest.xml"
          MAIN="app/src/main/java/com/taskmaster/promax/MainActivity.java"

          test -f "$MANIFEST"
          test -f "$MAIN"

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path(
              "app/src/main/AndroidManifest.xml"
          )

          s = manifest_path.read_text(
              encoding="utf-8"
          )

          required_permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]

          # Add missing permissions immediately after <manifest...>.
          missing = [
              p for p in required_permissions
              if p not in s
          ]

          if missing:

              match = re.search(
                  r'<manifest\b[^>]*>',
                  s,
                  flags=re.DOTALL
              )

              if not match:
                  raise SystemExit(
                      "ERROR: Invalid AndroidManifest.xml"
                  )

              additions = "\n"

              for permission in missing:
                  additions += (
                      f'    <uses-permission '
                      f'android:name="{permission}" />\n'
                  )

              additions += "\n"

              pos = match.end()

              s = (
                  s[:pos]
                  + additions
                  + s[pos:]
              )

          # Existing project already contains the reminder bridge.
          # Do not overwrite MainActivity or existing receivers.
          manifest_path.write_text(
              s,
              encoding="utf-8"
          )

          print("Notification permissions: PASS")
          PY

          echo
          echo "===== NATIVE REMINDER BRIDGE ====="

          grep -q "scheduleReminder" "$MAIN"
          grep -q "cancelReminder" "$MAIN"

          echo "Reminder bridge: PASS"

          echo
          echo "===== NOTIFICATION PERMISSION ====="

          grep -q "POST_NOTIFICATIONS" "$MANIFEST"

          echo "POST_NOTIFICATIONS: PASS"

          echo
          echo "===== BOOT RECEIVER ====="

          grep -q "BOOT_COMPLETED" "$MANIFEST"

          echo "BOOT_COMPLETED: PASS"

          echo
          echo "===== EXACT ALARM ====="

          grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST"

          echo "SCHEDULE_EXACT_ALARM: PASS"

      - name: Final notification source hardening
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/taskmaster/promax/MainActivity.java"
          MANIFEST="app/src/main/AndroidManifest.xml"
          HTML="app/src/main/assets/index.html"

          test -s "$MAIN"
          test -s "$MANIFEST"
          test -s "$HTML"

          echo "Checking existing native notification architecture..."

          grep -q "ReminderDatabase" "$MAIN"
          grep -q "scheduleReminder" "$MAIN"
          grep -q "cancelReminder" "$MAIN"
          grep -q "openTaskFromReminder" "$MAIN"
          grep -q "openTaskFromReminder" "$HTML"

          grep -q "POST_NOTIFICATIONS" "$MANIFEST"
          grep -q "BOOT_COMPLETED" "$MANIFEST"
          grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST"

          echo "Native notification architecture: PASS"

      - name: Verify final release source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -q 'versionCode 23' app/build.gradle
          grep -q 'versionName "1.1.2"' app/build.gradle

          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle

          grep -q \
            'sourceCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          grep -q \
            'targetCompatibility JavaVersion.VERSION_17' \
            app/build.gradle

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/TaskEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String taskId;' \
            app/src/main/java/com/taskmaster/promax/ReminderEntity.java

          grep -q \
            '@PrimaryKey @NonNull public String id;' \
            app/src/main/java/com/taskmaster/promax/RecurringTaskEntity.java

          grep -q \
            'int countOverdue(long now)' \
            app/src/main/java/com/taskmaster/promax/TaskDao.java

          test -f \
            app/src/main/java/com/taskmaster/promax/MainActivity.java

          test -f \
            app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/assets/index.html

          echo "Release source verification: PASS"

      - name: Run preflight checks
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/preflight.py

      - name: Run final build gate
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/final_build_gate.py

      - name: Run final release audit
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/final_release_audit.py

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            tasks --all

      - name: Compile Java and Room
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " TASKMASTER PRO MAX APK BUILD"
          echo " Version      : 1.1.2"
          echo " Version Code : 23"
          echo " Notifications: ENABLED"
          echo " Reminder Bell: ENABLED"
          echo " Exact Alarm  : ENABLED"
          echo " Boot Restore : ENABLED"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            find "$PROJECT_DIR/app/build" \
              -type f \
              -name "*.apk" \
              -print || true
            exit 1
          fi

          echo "APK CREATED:"
          ls -lh "$APK"

      - name: Verify APK with apksigner
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK verification: PASS"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            release/TaskMasterProMax-v1.1.2-debug.apk

          sha256sum \
            release/TaskMasterProMax-v1.1.2-debug.apk \
            | tee release/SHA256SUM.txt

          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TaskMasterProMax-v1.1.2-APK
          if-no-files-found: error
          path: |
            release/TaskMasterProMax-v1.1.2-debug.apk
            release/SHA256SUM.txt

      - name: Final build success
        run: |
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo "Version       : 1.1.2"
          echo "Version Code  : 23"
          echo "Notification  : ENABLED"
          echo "Reminder Bell : ENABLED"
          echo "Exact Alarm   : ENABLED"
          echo "Boot Restore  : ENABLED"
          echo "================================================"
``
