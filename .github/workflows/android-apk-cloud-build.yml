      - name: Repair Room configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          print("==============================================")
          print(" ROOM CONFIGURATION REPAIR")
          print("==============================================")

          # ---------------------------------------------------------
          # Find TaskDao.java automatically
          # ---------------------------------------------------------

          dao_files = list(
              Path("app/src/main/java").rglob("TaskDao.java")
          )

          if not dao_files:
              raise SystemExit(
                  "ERROR: TaskDao.java not found."
              )

          dao = dao_files[0]

          print("Using TaskDao:")
          print(dao)

          s = dao.read_text(
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Remove every existing countOverdue declaration.
          # This avoids duplicate methods.
          # ---------------------------------------------------------

          s = re.sub(
              r'(?s)@Query\s*\s*"SELECT\s+COUNT\s*\(\s*\*\s*'
              r'\s+FROM\s+tasks\s+WHERE\s+status\s*!=\s*[\'"]COMPLETED[\'"]'
              r'\s+AND\s+dueAt\s*<\s*:now"\s*\)'
              r'\s*(?:public\s+|protected\s+|private\s+|abstract\s+)*'
              r'int\s+countOverdue\s*[^;]*\s*;',
              '',
              s,
              flags=re.IGNORECASE
          )

          # Also remove a declaration if the old query formatting
          # is different.
          s = re.sub(
              r'(?m)^\s*(?:public\s+|protected\s+|private\s+|abstract\s+)*'
              r'int\s+countOverdue\s*[^;]*\s*;\s*$',
              '',
              s
          )

          # ---------------------------------------------------------
          # Insert the correct Room query immediately before the
          # final closing brace of TaskDao.
          # ---------------------------------------------------------

          method = '''
              @Query("SELECT COUNT(*) FROM tasks WHERE status!='COMPLETED' AND dueAt < :now")
              int countOverdue(long now);
          '''

          closing = s.rfind("}")

          if closing == -1:
              raise SystemExit(
                  "ERROR: TaskDao.java closing brace not found."
              )

          s = (
              s[:closing]
              + method
              + "\n"
              + s[closing:]
          )

          dao.write_text(
              s,
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Read the file again.
          # ---------------------------------------------------------

          verify = dao.read_text(
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Reliable verification.
          # Do NOT use the previous overly strict regex.
          # ---------------------------------------------------------

          if "countOverdue(long now)" not in verify:
              raise SystemExit(
                  "ERROR: countOverdue(long now) was not inserted."
              )

          if "@Query(" not in verify:
              raise SystemExit(
                  "ERROR: Room @Query annotation not found."
              )

          if "COUNT(*)" not in verify:
              raise SystemExit(
                  "ERROR: COUNT(*) query not found."
              )

          if "FROM tasks" not in verify:
              raise SystemExit(
                  "ERROR: tasks table query not found."
              )

          if "dueAt < :now" not in verify:
              raise SystemExit(
                  "ERROR: dueAt < :now condition not found."
              )

          print("")
          print("countOverdue(long now): PASS")
          print("Room COUNT query: PASS")
          print("dueAt condition: PASS")

          # ---------------------------------------------------------
          # Room Entity @NonNull repair
          # ---------------------------------------------------------

          entities = {
              "TaskEntity.java": "id",
              "ReminderEntity.java": "taskId",
              "RecurringTaskEntity.java": "id",
          }

          java_root = Path(
              "app/src/main/java"
          )

          for filename, field in entities.items():

              matches = list(
                  java_root.rglob(filename)
              )

              if not matches:
                  print(
                      f"WARNING: {filename} not found. Skipping."
                  )
                  continue

              p = matches[0]

              text = p.read_text(
                  encoding="utf-8"
              )

              if (
                  "import androidx.annotation.NonNull;"
                  not in text
              ):

                  package_match = re.search(
                      r'^\s*package\s+[^;]+;',
                      text,
                      re.MULTILINE
                  )

                  if package_match:

                      pos = package_match.end()

                      text = (
                          text[:pos]
                          + "\n\n"
                          + "import androidx.annotation.NonNull;"
                          + text[pos:]
                      )

              # Repair common Room String primary-key declaration.
              text = re.sub(
                  rf'@PrimaryKey\s+(?:public\s+)?String\s+'
                  rf'{re.escape(field)}\s*;',
                  f'@PrimaryKey @NonNull public String {field};',
                  text,
                  count=1
              )

              p.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  f"Checked Room entity: {filename}"
              )

          print("")
          print("==============================================")
          print(" ROOM CONFIGURATION: PASS")
          print("==============================================")
          PY
