name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e
          java -version
          gradle --version

      - name: Find TaskMaster Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_NAME="$(find . -maxdepth 1 -type f -name 'TaskMasterProMax_Android_*.zip' -printf '%f\n' | sort -V | tail -n 1)"

          if [ -z "$ZIP_NAME" ]; then
            echo "ERROR: TaskMasterProMax Android project ZIP not found."
            ls -lah
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"

          echo "Selected project:"
          echo "$ZIP_NAME"

      - name: Verify project ZIP
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ZIP"
          unzip -t "$PROJECT_ZIP" >/dev/null

          echo "ZIP integrity: PASS"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "Project extraction: PASS"

      - name: Determine Android project directory
        shell: bash
        run: |
          set -e

          if [ -f "extracted/project/settings.gradle" ] && [ -f "extracted/project/app/build.gradle" ]; then
            PROJECT_DIR="extracted/project"
          elif [ -f "extracted/settings.gradle" ] && [ -f "extracted/app/build.gradle" ]; then
            PROJECT_DIR="extracted"
          else
            echo "ERROR: Android Gradle project not found."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Repair release configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle not found.")

          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r"versionCode\s+\d+",
              "versionCode 23",
              s,
              count=1
          )

          s = re.sub(
              r'''versionName\s+["'][^"']+["']''',
              'versionName "1.1.2"',
              s,
              count=1
          )

          if "compileOptions" not in s:
              marker = "    buildTypes {"

              if marker in s:
                  block = """    compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }

          """

                  s = s.replace(marker, block + marker, 1)

          p.write_text(s, encoding="utf-8")

          print("Version: 1.1.2")
          print("Version code: 23")
          print("Release configuration: PASS")
          PY

      - name: Repair Room configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          dao_files = list(
              Path("app/src/main/java").rglob("TaskDao.java")
          )

          if not dao_files:
              raise SystemExit("ERROR: TaskDao.java not found.")

          dao = dao_files[0]

          print("Using:")
          print(dao)

          s = dao.read_text(encoding="utf-8")

          print("")
          print("Existing countOverdue declarations:")

          for line in s.splitlines():
              if "countOverdue" in line:
                  print(line)

          # Remove any existing countOverdue method and its Room query.
          s = re.sub(
              r'(?s)@Query\s*\s*"SELECT\s+COUNT\s*\(\s*\*\s*'
              r'\s+FROM\s+tasks\s+WHERE\s+status\s*!=\s*[\'"]COMPLETED[\'"]'
              r'\s+AND\s+dueAt\s*<\s*:now"\s*\)'
              r'\s*(?:public\s+|protected\s+|private\s+|abstract\s+)*'
              r'int\s+countOverdue\s*[^;]*\s*;',
              '',
              s,
              flags=re.IGNORECASE
          )

          s = re.sub(
              r'(?m)^\s*(?:public\s+|protected\s+|private\s+|abstract\s+)*'
              r'int\s+countOverdue\s*[^;]*\s*;\s*$',
              '',
              s
          )

          method = """
              @Query("SELECT COUNT(*) FROM tasks WHERE status!='COMPLETED' AND dueAt < :now")
              int countOverdue(long now);
          """

          pos = s.rfind("}")

          if pos == -1:
              raise SystemExit(
                  "ERROR: TaskDao.java closing brace not found."
              )

          s = s[:pos] + method + "\n" + s[pos:]

          dao.write_text(s, encoding="utf-8")

          verify = dao.read_text(encoding="utf-8")

          if "countOverdue(long now)" not in verify:
              raise SystemExit(
                  "ERROR: countOverdue(long now) was not inserted."
              )

          if "COUNT(*)" not in verify:
              raise SystemExit(
                  "ERROR: COUNT(*) query not found."
              )

          if "FROM tasks" not in verify:
              raise SystemExit(
                  "ERROR: tasks query not found."
              )

          if "dueAt < :now" not in verify:
              raise SystemExit(
                  "ERROR: dueAt < :now condition not found."
              )

          print("")
          print("countOverdue(long now): PASS")
          print("Room query: PASS")
          PY

      - name: Add Android notification permissions
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found."
              )

          s = p.read_text(encoding="utf-8")

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED"
          ]

          match = re.search(
              r"<manifest\b[^>]*>",
              s
          )

          if not match:
              raise SystemExit(
                  "ERROR: Invalid AndroidManifest.xml"
              )

          additions = ""

          for permission in permissions:
              if permission not in s:
                  additions += (
                      "\n    <uses-permission "
                      f'android:name="{permission}" />'
                  )

          if additions:
              s = (
                  s[:match.end()]
                  + additions
                  + "\n"
                  + s[match.end():]
              )

          p.write_text(s, encoding="utf-8")

          for permission in permissions:
              if permission not in s:
                  raise SystemExit(
                      f"ERROR: Missing permission: {permission}"
                  )

          print("Notification permissions: PASS")
          PY

      - name: Verify notification infrastructure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="$(find app/src/main/java -name 'MainActivity.java' | head -n 1)"

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          MANIFEST="app/src/main/AndroidManifest.xml"

          grep -q "ReminderDatabase" "$MAIN"
          grep -q "scheduleReminder" "$MAIN"
          grep -q "cancelReminder" "$MAIN"
          grep -q "POST_NOTIFICATIONS" "$MANIFEST"
          grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST"
          grep -q "RECEIVE_BOOT_COMPLETED" "$MANIFEST"

          echo "ReminderDatabase: PASS"
          echo "scheduleReminder: PASS"
          echo "cancelReminder: PASS"
          echo "Notification permissions: PASS"

      - name: Verify backup and migration safety
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "app/src/main/res/xml/backup_rules.xml" ]; then
            echo "ERROR: backup_rules.xml not found."
            exit 1
          fi

          if [ ! -f "app/src/main/res/xml/data_extraction_rules.xml" ]; then
            echo "ERROR: data_extraction_rules.xml not found."
            exit 1
          fi

          if grep -Rqs "fallbackToDestructiveMigration" app/src/main/java; then
            echo "ERROR: fallbackToDestructiveMigration found."
            exit 1
          fi

          echo "Backup rules: PASS"
          echo "Migration safety: PASS"

      - name: Verify final source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -q "versionCode 23" app/build.gradle
          grep -q 'versionName "1.1.2"' app/build.gradle

          DAO="$(find app/src/main/java -name 'TaskDao.java' | head -n 1)"

          grep -q "countOverdue(long now)" "$DAO"

          MAIN="$(find app/src/main/java -name 'MainActivity.java' | head -n 1)"

          grep -q "scheduleReminder" "$MAIN"
          grep -q "cancelReminder" "$MAIN"

          echo "FINAL SOURCE VERIFICATION: PASS"

      - name: Run preflight checks
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "tools/preflight.py" ]; then
            python3 tools/preflight.py
          else
            echo "WARNING: tools/preflight.py not found. Skipping."
          fi

      - name: Run final build gate
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "tools/final_build_gate.py" ]; then
            python3 tools/final_build_gate.py
          else
            echo "WARNING: final_build_gate.py not found. Skipping."
          fi

      - name: Run final release audit
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "tools/final_release_audit.py" ]; then
            python3 tools/final_release_audit.py
          else
            echo "WARNING: final_release_audit.py not found. Skipping."
          fi

      - name: Compile Debug Java
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK verification: PASS"

      - name: Prepare release
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            release/TaskMasterProMax-v1.1.2-debug.apk

          sha256sum \
            release/TaskMasterProMax-v1.1.2-debug.apk \
            > release/SHA256SUM.txt

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskMasterProMax-v1.1.2-APK
          if-no-files-found: error
          path: |
            release/TaskMasterProMax-v1.1.2-debug.apk
            release/SHA256SUM.txt

      - name: Build success
        run: |
          echo "=============================================="
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo " Version      : 1.1.2"
          echo " Version Code : 23"
          echo "=============================================="
