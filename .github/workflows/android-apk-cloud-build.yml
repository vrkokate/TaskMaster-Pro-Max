name: TaskMaster Pro Max - Android APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TaskMaster Pro Max APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      # ============================================================
      # 4. GRADLE 8.7
      # ============================================================

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'


      # ============================================================
      # 5. VERIFY JAVA + GRADLE
      # ============================================================

      - name: Verify Java and Gradle
        run: |
          set -e

          java -version
          gradle --version


      # ============================================================
      # 6. VERIFY V24 ZIP
      # ============================================================

      - name: Verify Android project ZIP
        run: |
          set -e

          ZIP=TaskMasterProMax_Android_v24_FINAL_CI_FIXED.zip

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V24 ZIP not found."
            echo
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          unzip -t "$ZIP" >/dev/null

          echo "V24 ZIP found:"
          ls -lh "$ZIP"

          echo
          echo "V24 ZIP SHA-256:"
          sha256sum "$ZIP"


      # ============================================================
      # 7. EXTRACT PROJECT
      # ============================================================

      - name: Extract Android project
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -q \
            TaskMasterProMax_Android_v24_FINAL_CI_FIXED.zip \
            -d extracted

          test -f extracted/project/settings.gradle
          test -f extracted/project/app/build.gradle
          test -f extracted/project/gradle.properties

          echo "Android project extracted successfully."


      # ============================================================
      # 8. VERIFY PROJECT VERSION + JAVA 17
      # ============================================================

      - name: Verify project version and Java 17 settings
        working-directory: extracted/project
        run: |
          set -e

          echo "Checking release version..."

          grep -q 'versionCode 22' app/build.gradle
          grep -q 'versionName "1.1.1"' app/build.gradle

          echo "Checking Java 17..."

          grep -q 'sourceCompatibility JavaVersion.VERSION_17' app/build.gradle
          grep -q 'targetCompatibility JavaVersion.VERSION_17' app/build.gradle

          echo "Checking Gradle properties..."

          grep -q 'org.gradle.jvmargs' gradle.properties

          echo
          echo "Project configuration verified successfully."


      # ============================================================
      # 9. PREFLIGHT
      # ============================================================

      - name: Run preflight checks
        working-directory: extracted/project
        run: |
          set -e

          python3 tools/preflight.py


      # ============================================================
      # 10. FINAL BUILD GATE
      # ============================================================

      - name: Run final build gate
        working-directory: extracted/project
        run: |
          set -e

          python3 tools/final_build_gate.py


      # ============================================================
      # 11. FINAL RELEASE AUDIT
      # ============================================================

      - name: Run final release audit
        working-directory: extracted/project
        run: |
          set -e

          python3 tools/final_release_audit.py


      # ============================================================
      # 12. VERIFY GRADLE PROJECT
      # ============================================================

      - name: Verify Gradle project
        working-directory: extracted/project
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            tasks --all


      # ============================================================
      # 13. BUILD APK
      # ============================================================

      - name: Build installable Debug APK
        working-directory: extracted/project
        run: |
          set -e

          echo "=============================================="
          echo " Building TaskMaster Pro Max APK"
          echo " Version 1.1.1 / Version Code 22"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

          echo
          echo "=============================================="
          echo " APK BUILD COMPLETED"
          echo "=============================================="


      # ============================================================
      # 14. VERIFY APK
      # ============================================================

      - name: Verify APK output
        working-directory: extracted/project
        run: |
          set -e

          APK=app/build/outputs/apk/debug/app-debug.apk

          if [ ! -s "$APK" ]; then
            echo "ERROR: app-debug.apk was not created."
            echo
            echo "Available build files:"
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"


      # ============================================================
      # 15. PREPARE APK ARTIFACT
      # ============================================================

      - name: Prepare APK artifact
        run: |
          set -e

          mkdir -p release

          cp \
            extracted/project/app/build/outputs/apk/debug/app-debug.apk \
            release/TaskMasterProMax-v1.1.1-debug.apk

          echo "APK SHA-256:"
          sha256sum \
            release/TaskMasterProMax-v1.1.1-debug.apk \
            | tee release/SHA256SUM.txt

          echo
          echo "Release files:"
          ls -lh release/


      # ============================================================
      # 16. UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TaskMasterProMax-v1.1.1-APK
          if-no-files-found: error
          path: |
            release/TaskMasterProMax-v1.1.1-debug.apk
            release/SHA256SUM.txt


      # ============================================================
      # 17. FINAL SUCCESS
      # ============================================================

      - name: Final success
        run: |
          echo
          echo "================================================"
          echo " TASKMASTER PRO MAX APK BUILD SUCCESS"
          echo "================================================"
          echo
          echo "Version      : 1.1.1"
          echo "Version Code : 22"
          echo "APK          : TaskMasterProMax-v1.1.1-debug.apk"
          echo
          echo "APK is available in GitHub Actions Artifacts."
          echo
